<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analyze on the map · mock-up v4</title>
<style>
/* =====================================================================
   Mock-up v3, not product code. Analyze opens on the BPMN map. The map is
   there at once with the engine's names; the AI names arrive in the
   background and swap in visibly (owner, O2). Business text around the
   map, three charts below it, code on demand (owner, O4), full screen
   with navigation, editing and the tour. IT and Management: one page each,
   everything at once. Nothing may cover anything: panels sit beside or
   below the map, never on it.
   Look: app/globals.css tokens, StageHeader, ToolBar, StageViewSwitch,
   process-map.css, CanvasViewControls / BpmnEditor (full screen).
   Content: Z_MM_PO_APPROVAL (552 lines).
   ===================================================================== */
:root{
  --cc-page:#f8f9ff;--cc-surface:#fff;--cc-surface-muted:#f9fafb;--cc-ink:#0b1c30;--cc-ink-muted:#4b5563;--cc-line:#e5e7eb;--cc-field-border:#6b7280;
  --cc-brand:#16a34a;--cc-brand-strong:#15803d;--cc-brand-deep:#006b2c;--cc-brand-surface:#f0fdf4;--cc-focus:#1d4ed8;
  --cc-success:#047857;--cc-success-bg:#ecfdf5;--cc-success-border:#a7f3d0;
  --cc-warning:#92400e;--cc-warning-bg:#fffbeb;--cc-warning-border:#fde68a;--cc-warning-line:#b45309;--cc-warning-mark:#d97706;
  --cc-error:#b91c1c;--cc-error-bg:#fef2f2;--cc-error-border:#fecaca;
  --cc-information:#1d4ed8;--cc-information-bg:#eff6ff;--cc-information-border:#bfdbfe;
  --cc-neutral:#4b5563;--cc-neutral-bg:#f9fafb;--cc-neutral-border:#e5e7eb;
  --cc-code-bg:#030712;--cc-code-ink:#e5e7eb;--cc-code-muted:#9ca3af;--cc-code-keyword:#c4b5fd;--cc-code-literal:#fcd34d;--cc-code-name:#93c5fd;
  --cc-score-1:#b91c1c;--cc-score-2:#d97706;--cc-score-3:#4f46e5;--cc-score-4:#1e1b4b;
  --cc-radius-card:12px;--cc-radius-row:8px;--cc-shadow:0 1px 2px rgb(0 0 0 / .04);--cc-shadow-dialog:0 16px 48px rgb(11 28 48 / .18);
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cc-page);font-family:var(--sans);font-size:14px;color:var(--cc-ink);-webkit-font-smoothing:antialiased}
p{margin:0}h1,h2,h3,h4{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--cc-focus);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
svg.i.s{width:12px;height:12px}

/* ---------- doc chrome (not product) ---------- */
.mock{position:sticky;top:0;z-index:200;background:#1f1147;color:#fff;font-size:12px;padding:6px 16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mock b{font-weight:700;margin-right:6px}
.mock button{background:transparent;border:1px solid #6d5bb8;color:#e9e5ff;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}
.mock button.on{background:#e9e5ff;color:#1f1147}
.mock .d{flex-basis:100%;color:#cfc8f3;font-weight:500;padding-top:2px}
body.embed .mock{display:none}

/* ---------- shell bar ---------- */
.shell{height:56px;display:flex;align-items:center;gap:20px;padding:0 24px;background:var(--cc-surface);border-bottom:1px solid var(--cc-line)}
.logo{display:flex;align-items:center;gap:9px;flex:none}
.logo .lg{width:32px;height:32px;border-radius:8px;background:var(--cc-brand-surface);color:var(--cc-brand);display:flex;align-items:center;justify-content:center}
.logo .n{display:block;font-weight:800;font-size:16px;letter-spacing:-.02em;line-height:1.15}
.logo .n em{font-style:normal;color:var(--cc-brand)}
.logo .s{display:block;font-size:11px;font-weight:500;color:var(--cc-ink-muted)}
.path{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--cc-ink-muted);white-space:nowrap;min-width:0;overflow:hidden}
.path .cur{color:var(--cc-ink);font-weight:600}
.shell-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--cc-field-border);border-radius:8px;height:32px;padding:0 10px;color:var(--cc-ink-muted);font-size:13px;width:220px;background:#fff}
.search kbd{margin-left:auto;font-family:var(--mono);font-size:11px;border:1px solid var(--cc-line);border-radius:4px;padding:0 4px}
.ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--cc-field-border);background:#fff;color:var(--cc-ink-muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.av{width:28px;height:28px;border-radius:8px;background:var(--cc-ink);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}

/* ---------- StageFrame + StageHeader ---------- */
.frame{max-width:1536px;margin:0 auto;padding:16px 32px 32px}
.headrow{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--cc-ink-muted);text-decoration:none;margin-top:6px}
.vs{margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--cc-field-border);border-radius:8px;padding:2px;background:#fff}
.seg button{border:0;background:transparent;padding:4px 12px;font-size:13px;font-weight:600;color:var(--cc-ink-muted);border-radius:6px;display:inline-flex;align-items:center;gap:5px;min-height:28px}
.seg button.on{background:var(--cc-ink);color:#fff}
.seg button.soft{color:#6b7280;font-weight:500}
.tools{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.tools .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--cc-ink-muted);margin-right:4px}
.tool{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--cc-ink);border:1px solid var(--cc-line);background:#fff;border-radius:8px;padding:5px 10px;min-height:32px;text-decoration:none}
.tool.cur{background:var(--cc-ink);border-color:var(--cc-ink);color:#fff}
.tool.cur .ck{color:#a7f3d0}
.tool.soft{color:var(--cc-ink-muted);font-weight:500;background:var(--cc-surface-muted)}
.tools .legend{margin-left:auto;font-size:12px;font-weight:500;color:var(--cc-ink-muted);display:flex;gap:12px}
.tools .legend span{display:inline-flex;gap:4px;align-items:center}
.tools .hint{margin-left:4px;font-size:12px;font-weight:500;color:var(--cc-ink-muted)}
.sh{display:flex;align-items:flex-end;gap:16px;margin-top:14px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--cc-ink-muted)}
.sh h1{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-top:2px;display:flex;align-items:center;gap:8px}
.sh h1 svg{color:var(--cc-ink-muted);width:20px;height:20px}
.sh .lead{font-size:14px;font-weight:500;color:var(--cc-ink-muted);margin-top:2px}

/* ---------- cc components ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;line-height:1.1;border-radius:8px;padding:8px 12px;min-height:32px;border:1px solid transparent;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--cc-brand-strong);border-color:var(--cc-brand-strong);color:#fff}
.btn.secondary{background:var(--cc-brand-surface);border-color:var(--cc-brand-strong);color:var(--cc-brand-strong)}
.btn.ghost{background:#fff;border-color:var(--cc-field-border);color:var(--cc-ink-muted)}
.btn.ghost[aria-pressed=true]{background:var(--cc-ink);border-color:var(--cc-ink);color:#fff}
.btn.lg{min-height:40px;font-size:14px;padding:10px 16px}
.btn[disabled]{opacity:.5}
.lnk{font-size:13px;font-weight:600;color:var(--cc-ink);text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0}
.pv{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;line-height:16px;padding:1px 8px 1px 6px;border-radius:999px;border:1px solid;white-space:nowrap;vertical-align:middle;background:#fff}
.pv svg.i{width:12px;height:12px}
.pv.rec{color:var(--cc-information);border-color:var(--cc-information)}
.pv.ai{color:var(--cc-warning);border-color:var(--cc-warning-line);border-style:dashed}
.pv.nd{color:var(--cc-neutral);border-color:var(--cc-neutral)}
.pv.imp{color:var(--cc-information);border-color:var(--cc-information)}
.card{background:#fff;border:1px solid var(--cc-line);border-radius:12px;box-shadow:var(--cc-shadow);min-width:0}
.pad{padding:16px 20px}
.muted{color:var(--cc-ink-muted)}
.sm{font-size:13px}
.k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--cc-ink-muted)}
.h2{font-size:15px;font-weight:700}
.mtag{display:inline-flex;font-size:11px;font-weight:600;color:#5b21b6;background:#f5f3ff;border:1px dashed #a78bfa;border-radius:4px;padding:0 5px;white-space:nowrap}
.ln{font-size:12px;font-weight:500;color:var(--cc-ink-muted);text-decoration:underline;text-decoration-color:#c3c8d0;text-underline-offset:2px;background:none;border:0;padding:0;white-space:nowrap;font-family:var(--mono)}
.anc{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--cc-information);background:var(--cc-information-bg);border:1px solid var(--cc-information-border);border-radius:4px;padding:0 5px;line-height:17px;margin:1px 2px 1px 0;white-space:nowrap}
.strip{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--cc-information-border);background:var(--cc-information-bg);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:500;line-height:1.5;color:var(--cc-ink);margin-top:12px}
.strip svg{color:var(--cc-information);margin-top:2px}
.strip .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- code ---------- */
.code{background:var(--cc-code-bg);color:var(--cc-code-ink);font-family:var(--mono);font-size:12px;border-radius:8px;padding:6px 0;line-height:1.6;overflow-x:auto}
.code .l{display:flex;white-space:pre}
.code .l .no{width:40px;text-align:right;color:var(--cc-code-muted);padding-right:10px;flex:none}
.code .l .tx{padding-right:12px}
.code .l.hl{background:rgb(59 130 246 / .28);box-shadow:inset 3px 0 0 var(--cc-code-name)}
.code .kw{color:var(--cc-code-keyword)}.code .lit{color:var(--cc-code-literal)}.code .cm{color:var(--cc-code-muted)}

/* ---------- business: summary above the map ---------- */
.sumcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:start;background:#fff;border:1px solid var(--cc-line);border-radius:12px;box-shadow:var(--cc-shadow);padding:14px 18px;margin-top:12px}
.sumcard h2{font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sumcard .txt p{font-size:14px;line-height:1.55;font-weight:500;margin-top:4px;max-width:900px}
.sumcard .txt p.why{color:var(--cc-ink-muted);font-size:13px}
.sumcard .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sumcard .ways-c{min-width:300px}
.wait{display:inline-block;height:10px;border-radius:5px;background:linear-gradient(90deg,#eef0f3,#f6f7f9,#eef0f3);vertical-align:middle}
.grow{display:none}.grow.in{display:block}
.grow-p{display:block}.grow-p.out{display:none}
li.grow.in{display:flex}
.gl{animation:fadein .5s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- the map ---------- */
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:12px;align-items:start}
.mapgrid.side{grid-template-columns:minmax(0,1fr) 360px}
.mapcol{min-width:0}
.maptools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--cc-line);border-radius:12px;padding:6px 8px;margin-bottom:8px}
.maptools .seg button{font-size:12px;padding:3px 10px;min-height:26px}
.maptools .tb{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--cc-ink-muted);border:1px solid var(--cc-field-border);background:#fff;border-radius:8px;padding:4px 8px;min-height:28px}
.maptools .z{min-width:40px;text-align:center;font-size:12px;font-weight:600;color:var(--cc-ink-muted);font-variant-numeric:tabular-nums}
.maptools .sp{margin-left:auto}
.maptools .showing{font-size:12px;font-weight:600;color:var(--cc-ink);display:inline-flex;gap:6px;align-items:center;background:var(--cc-information-bg);border:1px solid var(--cc-information-border);border-radius:8px;padding:3px 8px}
.mapcard{position:relative;overflow-x:auto;overflow-y:hidden;border-radius:12px;border:1px solid var(--cc-line);background:var(--cc-surface);box-shadow:var(--cc-shadow)}
.mapcard svg.map{display:block}
.mapnote{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12px;font-weight:500;color:var(--cc-ink-muted)}
.mapnote .pen{color:var(--cc-warning)}
.status{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;background:#fff;border:1px solid var(--cc-line);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:13px;font-weight:500}
.status .bar{flex:0 0 140px;height:4px;background:var(--cc-line);border-radius:2px;overflow:hidden}
.status .bar i{display:block;height:100%;background:var(--cc-ink)}
.status .sub{color:var(--cc-ink-muted);font-size:12px}
.status .dotx{width:8px;height:8px;border-radius:999px;background:var(--cc-information);flex:none;animation:pulse 1.2s ease-in-out infinite}
.status.calm .dotx{background:var(--cc-success);animation:none}
@keyframes pulse{50%{opacity:.35}}

/* SVG: bpmn-js look in product tokens */
.el .sh{fill:var(--cc-surface);stroke:var(--cc-ink);stroke-width:2;transition:fill .3s}
.el.end .sh{stroke-width:4}
.el text{fill:var(--cc-ink);font-family:var(--sans);font-size:12px}
.el text.anc{fill:var(--cc-ink-muted);font-family:var(--mono);font-size:11px}
.el .mk{stroke:var(--cc-ink);stroke-width:2;fill:none}
.el .pen{fill:none;stroke:var(--cc-warning);stroke-width:1.6}
.el .wt circle{fill:var(--cc-ink-muted)}
.el .badge rect{fill:#fff;stroke:var(--cc-neutral-border)}
.el .badge text{fill:var(--cc-neutral);font-size:11px;font-weight:600}
.el.swap .sh{fill:var(--cc-information-bg)}
.el{cursor:pointer}
.fl path{fill:none;stroke:var(--cc-ink);stroke-width:1.5}
.fl text{fill:var(--cc-ink);font-size:12px;font-family:var(--sans)}
.band rect{fill:var(--cc-surface-muted);stroke:var(--cc-line)}
.band text{fill:var(--cc-ink-muted);font-size:11px;font-weight:600;letter-spacing:.08em}
.map.open .el,.map.open .fl{animation:fadein .4s ease both}
/* focus: tour station, chart highlight, search hit (process-map.css .cc-tour-canvas) */
.t .el.dim .sh,.t .el.dim .mk{stroke:var(--cc-line)}
.t .el.dim text{fill:var(--cc-ink-muted)}
.t .el.dim .pen{opacity:.4}
.t .fl.dim path{stroke:var(--cc-line)}
.t .fl.dim text{fill:var(--cc-ink-muted)}
.t .el.here .sh{stroke:var(--cc-ink);stroke-width:3;fill:var(--cc-information-bg)}
.t .el.here text{font-weight:600}
.el.sel .sh{stroke:var(--cc-information);stroke-width:3}
.selbox{fill:none;stroke:var(--cc-information);stroke-width:1.5;stroke-dasharray:4 3}

/* side column: tour card or code panel (beside the map, never on it) */
.sidecol{display:flex;flex-direction:column;gap:12px;min-width:0}
.tour{display:flex;flex-direction:column;background:#fff;border:1px solid var(--cc-line);border-radius:12px;box-shadow:var(--cc-shadow)}
.tour-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--cc-line)}
.tour-head .pos{font-size:12px;font-weight:600;color:var(--cc-ink-muted)}
.dots{display:flex;gap:4px;margin-left:auto}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--cc-line);display:block}
.dots i.d{background:var(--cc-ink-muted)}
.dots i.c{background:var(--cc-ink);width:14px}
.tour-card{display:flex;flex-direction:column;gap:10px;padding:16px}
.tour-card .q{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--cc-ink-muted)}
.tour-card h2{font-size:17px;font-weight:700;line-height:1.35}
.tour-card .nar p{font-size:14px;line-height:1.6;font-weight:500}
.tour-card .nar p+p{margin-top:8px}
.tour-card .quiet{font-size:13px;color:var(--cc-ink-muted);line-height:1.5}
.prov{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--cc-ink-muted)}
.tour-nav{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--cc-line);flex-wrap:wrap}
.tour-nav .r{margin-left:auto;display:flex;gap:8px}
.codepanel{background:#fff;border:1px solid var(--cc-line);border-radius:12px;box-shadow:var(--cc-shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.codepanel .top{display:flex;gap:8px;align-items:flex-start}
.codepanel .top .x{margin-left:auto}
.codepanel h3{font-size:15px;font-weight:700;line-height:1.35}

/* charts below the map (recharts look: thin bars, 4px round ends, ink text) */
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.chart{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.chart h3{font-size:14px;font-weight:700}
.chart .take{font-size:13px;font-weight:600;line-height:1.45}
.chart .foot{font-size:12px;color:var(--cc-ink-muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:4px}
.bars{display:grid;gap:2px;margin:2px 0}
.brow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(60px,1fr) 28px;gap:8px;align-items:center;border:0;background:none;padding:5px 6px;border-radius:8px;text-align:left;font-size:13px;font-weight:500;color:var(--cc-ink);width:100%}
.brow:hover,.brow.on{background:var(--cc-information-bg)}
.brow .lab{line-height:1.3}
.brow .lab small{display:block;font-size:12px;color:var(--cc-ink-muted);font-weight:500}
.brow .track{height:12px;position:relative}
.brow .track i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--cc-information)}
.brow .track i.out{background:#fff;border:1.5px dashed var(--cc-information)}
.brow .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.stack1{display:flex;gap:2px;height:14px;margin-top:2px}
.stack1 i{display:block;height:100%;border-radius:2px}
.stack1 i.a{background:var(--cc-information);border-radius:4px 0 0 4px}
.stack1 i.b{background:#fff;border:1.5px dashed var(--cc-information);border-radius:0 4px 4px 0}
.keyrow{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--cc-ink-muted);font-weight:500}
.keyrow span{display:inline-flex;gap:5px;align-items:center}
.keyrow i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--cc-information)}
.keyrow i.b{background:#fff;border:1.5px dashed var(--cc-information)}

/* business text below the charts */
.about{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,1.2fr);gap:12px;margin-top:12px;align-items:start}
.about section{padding:16px 18px}
.about h3{font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.runs{list-style:none;margin:8px 0 0;padding:0;counter-reset:r}
.runs li{padding:8px 0 8px 12px;border-left:3px solid transparent;margin-left:-12px;padding-left:12px}
.runs li.now{border-left-color:var(--cc-ink);background:var(--cc-information-bg);border-radius:0 8px 8px 0}
.runs li b{font-size:13px;font-weight:700;display:block}
.runs li p{font-size:14px;line-height:1.55;font-weight:500;margin-top:2px}
.who,.qs{list-style:none;margin:8px 0 0;padding:0}
.who li,.qs li{font-size:14px;line-height:1.5;font-weight:500;padding:7px 0;border-top:1px solid #eef0f3}
.who li:first-child,.qs li:first-child{border-top:0}
.who li b{font-weight:700}
.qs li{display:flex;gap:8px}
.qs li .n{flex:none;width:20px;height:20px;border-radius:999px;border:1.5px solid var(--cc-field-border);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.hint2{font-size:12px;color:var(--cc-ink-muted);line-height:1.5;margin-top:8px}

/* endings */
.ways{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.way{background:#fff;border:1px solid var(--cc-line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;box-shadow:var(--cc-shadow)}
.way h3{font-size:14px;font-weight:700}
.way p{font-size:13px;color:var(--cc-ink-muted);line-height:1.5;flex:1}
.ways-c{display:grid;gap:10px}
.ways-c .btn{width:100%;justify-content:space-between}
.ways-c p{font-size:12px;color:var(--cc-ink-muted);margin-top:4px;line-height:1.45}
.extras{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:10px}
.extras .lnk{display:inline-flex;gap:6px;align-items:center;font-weight:500;color:var(--cc-ink-muted)}
.endsec{margin-top:16px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;align-items:stretch}
.walked{background:#fff;border:1px solid var(--cc-line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;box-shadow:var(--cc-shadow)}

/* IT + management: one page each */
.page{display:grid;gap:12px;margin-top:14px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:start}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.sec{padding:16px 20px;min-width:0}
.sec > .h2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec .lede{font-size:13px;color:var(--cc-ink-muted);margin-top:2px;line-height:1.5}
.fig{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.fig b{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
.fig span{font-size:16px;font-weight:600;color:var(--cc-ink-muted)}
.band2{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px;font-weight:700;flex-wrap:wrap}
.band2 i{width:12px;height:12px;border-radius:3px;background:var(--cc-score-1)}
.band2 small{font-size:13px;font-weight:500;color:var(--cc-ink-muted)}
.scale{position:relative;margin-top:14px;height:12px;display:flex;gap:2px}
.scale span{height:12px;border-radius:2px}
.scale .m{position:absolute;top:-5px;width:6px;height:22px;background:var(--cc-ink);border-radius:2px;box-shadow:0 0 0 2px #fff;transform:translateX(-3px)}
.note{font-size:12px;color:var(--cc-ink-muted);line-height:1.5;margin-top:10px}
.lv{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font-size:12px;font-weight:600;border:1px solid;margin:4px 3px 0 0;white-space:nowrap}
.lv.B{background:#f3f4f6;border-color:#d1d5db;color:#374151}
.lv.C{background:var(--cc-warning-bg);border-color:var(--cc-warning-border);color:var(--cc-warning)}
.lv.D{background:var(--cc-error-bg);border-color:var(--cc-error-border);color:var(--cc-error)}
.lv.U{background:#fff;border-color:var(--cc-field-border);color:var(--cc-ink-muted);border-style:dashed}
.facts{list-style:none;margin:8px 0 0;padding:0}
.facts li{font-size:14px;font-weight:500;line-height:1.5;padding:7px 0;border-top:1px solid #eef0f3}
.facts li:first-child{border-top:0}
.facts b{font-weight:700}
.dt{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.dt th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--cc-ink-muted);padding:6px 8px;border-bottom:1px solid var(--cc-line);background:var(--cc-surface-muted)}
.dt td{padding:8px;border-bottom:1px solid #eef0f3;font-weight:500;vertical-align:top;line-height:1.4}
.dt td code,.cd{font-family:var(--mono);font-size:12px;background:var(--cc-code-bg);color:var(--cc-code-ink);border-radius:4px;padding:1px 6px;white-space:nowrap}
.tblwrap{overflow-x:auto}
.find{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;padding:14px 0;border-top:1px solid var(--cc-line);align-items:start}
.find:first-of-type{border-top:0}
.find h3{font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.find p{font-size:13px;line-height:1.55;color:var(--cc-ink);margin-top:4px}
.sev{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--cc-error);flex:none}
.sev.m{background:var(--cc-warning-mark)}.sev.n{background:#fff;border:1.5px dashed var(--cc-neutral)}
.mainseq{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-top:10px;align-items:start}
.calls{list-style:none;margin:0;padding:0;font-size:13px}
.calls li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:2px 0;line-height:1.6;font-weight:500}
.calls li span{font-family:var(--mono);font-size:12px;color:var(--cc-ink-muted);text-align:right}
.ctx{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--cc-ink);background:var(--cc-information-bg);border:1px solid var(--cc-information-border);border-radius:8px;padding:8px 10px;line-height:1.5;margin-top:12px}
.ctx svg{color:var(--cc-information);margin-top:3px}
.big{font-size:20px;font-weight:700;line-height:1.35}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{padding:14px 16px}
.tile .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
.tile .v small{font-size:13px;font-weight:600;color:var(--cc-ink-muted);letter-spacing:0}
.tile p{font-size:12px;color:var(--cc-ink-muted);margin-top:4px;line-height:1.45}
.indic{border:1.5px solid var(--cc-ink);border-radius:12px;padding:14px 16px;background:var(--cc-surface)}
.indic .big{margin-top:4px}
.opt th.on,.opt td.on{background:var(--cc-information-bg)}
.opt th.on{color:var(--cc-ink)}
.steps{list-style:none;margin:8px 0 0;padding:0;counter-reset:s}
.steps li{display:flex;gap:10px;padding:7px 0;border-top:1px solid #eef0f3;font-size:14px;font-weight:500;line-height:1.5}
.steps li:first-child{border-top:0}
.steps li .n{flex:none;width:22px;height:22px;border-radius:999px;background:var(--cc-ink);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}

/* ---------- full screen (BpmnEditor .cc-editor-fullscreen) ---------- */
.fs{position:fixed;inset:0;z-index:100;background:var(--cc-page);display:flex;flex-direction:column;gap:8px;padding:8px;overflow:hidden}
.fsbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border:1px solid var(--cc-line);border-radius:12px;padding:8px}
.fsbar .ttl{font-size:14px;font-weight:700;display:flex;flex-direction:column;line-height:1.25;margin-right:8px}
.fsbar .ttl small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--cc-ink-muted)}
.fsbar .vr{height:24px;border-left:1px solid var(--cc-line)}
.fsbar .sp{margin-left:auto}
.fsbar .tb,.palette .tb{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--cc-ink);border:1px solid var(--cc-field-border);background:#fff;border-radius:8px;padding:5px 10px;min-height:32px;white-space:nowrap}
.fsbar .tb[aria-pressed=true]{background:var(--cc-ink);color:#fff;border-color:var(--cc-ink)}
.fsbar .z{min-width:44px;text-align:center;font-size:12px;font-weight:600;color:var(--cc-ink-muted);font-variant-numeric:tabular-nums}
.fsfind{display:flex;align-items:center;gap:8px;border:1px solid var(--cc-field-border);border-radius:8px;height:32px;padding:0 10px;font-size:13px;width:220px;background:#fff;color:var(--cc-ink)}
.fsfind.empty{color:var(--cc-ink-muted)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;border:1px solid var(--cc-field-border);border-radius:8px;padding:4px 10px;min-height:32px;background:#fff;color:var(--cc-ink)}
.switch .tr{width:28px;height:16px;border-radius:999px;background:#d1d5db;position:relative;flex:none}
.switch .tr::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:999px;background:#fff}
.switch[aria-pressed=true] .tr{background:var(--cc-ink)}
.switch[aria-pressed=true] .tr::after{left:14px}
.palette{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--cc-surface-muted);border:1px solid var(--cc-line);border-radius:12px;padding:8px}
.palette .grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.palette .grp > span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--cc-ink-muted);margin-right:4px}
.fsnote{font-size:12px;font-weight:500;color:var(--cc-ink-muted);padding:0 4px}
.fsbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:8px}
.fscanvas{min-width:0;min-height:0;overflow:auto;border:1px solid var(--cc-line);border-radius:12px;background:#fff}
.fscanvas svg.map{display:block}
.rail{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.rail .panel{background:#fff;border:1px solid var(--cc-line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rail .panel h4{font-size:13px;font-weight:700}
.mini svg{display:block;width:100%;height:auto;border:1px solid var(--cc-line);border-radius:8px;background:var(--cc-surface-muted)}
.hits{list-style:none;margin:0;padding:0}
.hits li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid #eef0f3;font-size:13px;font-weight:500}
.hits li:first-child{border-top:0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--cc-ink-muted)}
.fld .in{border:1px solid var(--cc-field-border);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:500;color:var(--cc-ink);background:#fff;min-height:34px}
.fld .in.ro{background:var(--cc-surface-muted);font-family:var(--mono);font-size:12px}
.fld small{font-weight:500;line-height:1.4}
.rail .acts{display:flex;gap:8px;flex-wrap:wrap}
.fsstatus{margin:0}


/* v4: what comes next, after the walk-through (in the flow, never on top) */
.seg button.nudge{box-shadow:inset 0 0 0 2px var(--cc-information-border);color:var(--cc-ink)}
.nextcard{margin-top:12px;background:#fff;border:1px solid var(--cc-information-border);border-radius:12px;box-shadow:var(--cc-shadow);padding:12px 16px;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:12px 24px;position:relative}
.nextcard .nxtop{grid-column:1 / -1;display:flex;gap:12px;align-items:center}
.nextcard .nxtop > button{margin-left:auto}
.nextcard.closed{padding:8px 16px}
.nxtoggle{border:0;background:none;padding:0;font:inherit;font-size:15px;font-weight:700;color:var(--cc-ink);display:inline-flex;gap:6px;align-items:center}
.nxtoggle .chev{display:inline-flex;transition:transform .2s}
.nxtoggle .chev.o{transform:rotate(90deg)}
.nextcard h2{font-size:15px;font-weight:700}
.nextcard h3{font-size:13px;font-weight:700}
.nviews,.ntools{list-style:none;margin:6px 0 0;padding:0}
.nviews li{padding:4px 0}
.nviews button{display:flex;gap:8px;align-items:flex-start;text-align:left;border:0;background:none;padding:4px 6px;border-radius:8px;font-size:13px;font-weight:500;line-height:1.45;color:var(--cc-ink);width:100%}
.nviews button:hover{background:var(--cc-information-bg)}
.nviews b{font-weight:700;white-space:nowrap}
.nviews .up{color:var(--cc-information);margin-top:2px}
.ntools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 16px}
.ntools li{font-size:13px;line-height:1.45;font-weight:500;padding:3px 0;color:var(--cc-ink-muted)}
.ntools li b{color:var(--cc-ink);font-weight:700}
.redesign{font-size:12px;color:var(--cc-ink-muted);line-height:1.5;margin:0;padding:0;list-style:none}
.redesign li{padding:1px 0}
.redesign b{color:var(--cc-ink);font-weight:600}
@media (max-width:1279px){ .ntools{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:1023px){ .nextcard{grid-template-columns:minmax(0,1fr)} }
@media (max-width:640px){ .ntools{grid-template-columns:minmax(0,1fr)} }

/* ---------- responsive ---------- */
.only-phone{display:none}
@media (max-width:1279px){
  .mapgrid.side{grid-template-columns:minmax(0,1fr) 320px}
  .about{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .about .runsec{grid-column:1 / -1}
  .tools .hint,.tools .legend{flex-basis:100%;margin-left:0}
}
@media (max-width:1100px){
  .mapgrid.side{grid-template-columns:minmax(0,1fr)}
  .mapgrid.side .sidecol{order:-1}
  .charts{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .charts .chart:last-child{grid-column:1 / -1}
  .row2{grid-template-columns:minmax(0,1fr)}
  .row3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .row3 > :last-child{grid-column:1 / -1}
  .mainseq{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fsbody{grid-template-columns:minmax(0,1fr) 300px}
}
@media (max-width:1023px){
  .shell .search{display:none}
  .mapgrid.side{grid-template-columns:minmax(0,1fr)}
  .sumcard{grid-template-columns:minmax(0,1fr)}
  .sumcard .acts{justify-content:flex-start}
  .endsec{grid-template-columns:minmax(0,1fr)}
  .find{grid-template-columns:minmax(0,1fr)}
  .fs{overflow:auto}
  .fsbody{display:flex;flex-direction:column;flex:none}
  .fscanvas{height:60vh;flex:none}
  .rail{overflow:visible}
}
@media (max-width:767px){
  .path{display:none}
  .charts,.about,.row3,.ways,.tiles{grid-template-columns:minmax(0,1fr)}
  .charts .chart:last-child,.row3 > :last-child,.about .runsec{grid-column:auto}
}
@media (max-width:640px){
  .only-phone{display:inline-flex}
  .only-desk{display:none!important}
  .shell{padding:0 12px;gap:10px;height:52px}
  .frame{padding:12px 16px 24px}
  .headrow{flex-direction:column;gap:8px}
  .vs{margin-left:0;width:100%}
  .vs .seg{display:flex;width:100%}
  .vs .seg button{flex:1;justify-content:center}
  .tools .tool:not(.menu){display:none}
  .sh .lead{display:none}
  .sumcard{padding:12px 14px}
  .sumcard .ways-c{min-width:0}
  .maptools .tb .w{display:none}
  .fig b{font-size:48px}
  .dt .hp{display:none}
  .fsfind{width:100%}
  .fsbar .ttl{flex-basis:100%}
}
@media (prefers-reduced-motion: reduce){ .map.open .el,.map.open .fl,.gl{animation:none} .el .nm{transition:none} .status .dotx{animation:none} }

function port(n,side){ const w = n.k==='t'?TW/2 : n.k==='g'?GS : ER; const h = n.k==='t'?TH/2 : n.k==='g'?GS : ER;
  return side==='r'?[n.x+w,n.y]:side==='l'?[n.x-w,n.y]:side==='b'?[n.x,n.y+h]:[n.x,n.y-h]; }
function route(a,b){ const A=EL[a],B=EL[b];
  if (Math.abs(A.y-B.y)<2) return [port(A,'r'),port(B,'l')];
  if (B.y>A.y && Math.abs(A.x-B.x)<2) return [port(A,'b'),port(B,'t')];
  if (B.y>A.y){ const p=port(A,'b'),q=port(B,'l'); return [p,[p[0],q[1]],q]; }
  if (B.y<A.y && A.k==='g'){ const p=port(A,'t'),q=port(B,'l'); return [p,[p[0],q[1]],q]; }
  const p=port(A,'r'),q=port(B,'b'); return [p,[q[0],p[1]],q]; }
function wrap(s,max){ const w=s.split(' '); const out=[]; let cur=''; for(const x of w){ if((cur+' '+x).trim().length>max && cur){out.push(cur);cur=x;} else cur=(cur+' '+x).trim(); } if(cur)out.push(cur); return out; }
const PEN = (x,y)=>`<g class="pen" transform="translate(${x},${y}) scale(.5)"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></g>`;
const WAIT = (x,y)=>`<g class="wt" transform="translate(${x},${y})"><circle cx="0" cy="0" r="1.6"/><circle cx="5" cy="0" r="1.6"/><circle cx="10" cy="0" r="1.6"/></g>`;
// label lines for one name, per kind; returns svg text
function nameTexts(n, name){
  if (n.k==='t'){ const L=wrap(name,18); const last=n.y+TH/2-24; const y0=last-(L.length-1)*LH; return L.map((l,i)=>`<text x="${n.x}" y="${y0+i*LH}" text-anchor="middle">${esc(l)}</text>`).join(''); }
  if (n.k==='g'){ const L=wrap(name,n.id==='G4'?15:20);
    if (n.id==='G4') return L.map((l,i)=>`<text x="${n.x}" y="${n.y+GS+18+i*LH}" text-anchor="middle">${esc(l)}</text>`).join('');
    return L.map((l,i)=>`<text x="${n.x}" y="${n.y-GS-10-(L.length-1-i)*LH}" text-anchor="middle">${esc(l)}</text>`).join(''); }
  const L=wrap(name, n.k==='lc'?12:16); return L.map((l,i)=>`<text x="${n.x}" y="${n.y+ER+16+i*LH}" text-anchor="middle">${esc(l)}</text>`).join('');
}
function nlines(n,name){ return wrap(name, n.k==='t'?18 : n.k==='g'?(n.id==='G4'?15:20) : n.k==='lc'?12:16).length; }
function elSvg(n){
  let g='', anc='', mark='', pen='', wt='';
  const maxL = Math.max(nlines(n,n.name), nlines(n,n.eng));
  if (n.k==='t'){
    g=`<rect class="sh" x="${n.x-TW/2}" y="${n.y-TH/2}" width="${TW}" height="${TH}" rx="10"/>`;
    anc=`<text class="anc" x="${n.x}" y="${n.y+TH/2-6}" text-anchor="middle">line ${n.line}</text>`;
    pen=PEN(n.x+TW/2-16,n.y-TH/2+3); wt=WAIT(n.x+TW/2-20,n.y-TH/2+10);
  } else if (n.k==='g'){
    g=`<path class="sh" d="M${n.x} ${n.y-GS} L${n.x+GS} ${n.y} L${n.x} ${n.y+GS} L${n.x-GS} ${n.y} Z"/><path class="mk" d="M${n.x-7} ${n.y-7} L${n.x+7} ${n.y+7} M${n.x+7} ${n.y-7} L${n.x-7} ${n.y+7}"/>`;
    anc = n.id==='G4' ? `<text class="anc" x="${n.x}" y="${n.y+GS+20+maxL*LH}" text-anchor="middle">line ${n.line}</text>` : `<text class="anc" x="${n.x+8}" y="${n.y+GS+40}">line ${n.line}</text>`;
    pen=PEN(n.x+GS-1,n.y-GS+1); wt=WAIT(n.x-GS-12,n.y-GS+4);
  } else {
    if (n.k==='e'||n.k==='ee') g=`<circle class="sh" cx="${n.x}" cy="${n.y}" r="${ER}"/>`; else g=`<circle class="sh" cx="${n.x}" cy="${n.y}" r="${ER}"/>`;
    if (n.k==='lt'||n.k==='lc') mark=`<path class="mk" d="M${n.x-8} ${n.y-4} h8 v-5 l8 9 -8 9 v-5 h-8 Z" style="${n.k==='lt'?'fill:var(--cc-ink)':''}"/>`;
    anc=`<text class="anc" x="${n.x}" y="${n.y+ER+18+maxL*LH}" text-anchor="middle">line ${n.line}</text>`;
    pen=PEN(n.x+ER+1,n.y-ER-4); wt=WAIT(n.x+ER+3,n.y-ER+2);
    if (n.k==='ee') g+=`<g class="badge"><rect x="${n.x-28}" y="${n.y-ER-21}" width="56" height="16" rx="4"/><text x="${n.x}" y="${n.y-ER-9}" text-anchor="middle">early end</text></g>`;
  }
  if (n.id==='T8') g+=`<g class="badge"><rect x="${n.x-62}" y="${n.y-TH/2-21}" width="124" height="16" rx="4"/><text x="${n.x}" y="${n.y-TH/2-9}" text-anchor="middle">2 parts not in the upload</text></g>`;
  const names = n.ai ? `<g class="nm eng">${nameTexts(n,n.eng)}</g><g class="nm fin">${nameTexts(n,n.name)}</g>${pen}${wt}` : `<g class="nm">${nameTexts(n,n.name)}</g>`;
  return `<g class="el ${(n.k==='e'||n.k==='ee')?'end':''}" data-id="${n.id}" role="button" tabindex="-1" aria-label="${esc(n.name)}, line ${n.line}">${g}${mark}${names}${anc}</g>`;
}
function flowSvg(f){ const pts=route(f[0],f[1]); const d='M'+pts.map(p=>p.join(' ')).join(' L');
  const last=pts[pts.length-1], prev=pts[pts.length-2]; const ang=Math.atan2(last[1]-prev[1],last[0]-prev[0]);
  const ax=(a)=>[last[0]-9*Math.cos(ang+a),last[1]-9*Math.sin(ang+a)]; const [p1,p2]=[ax(.4),ax(-.4)];
  let lab=''; if(f[2]){ const p=pts[0], q=pts[1]; const horiz=Math.abs(p[1]-q[1])<2; const lx = horiz ? p[0]+12 : p[0]+6; const ly = horiz ? p[1]-7 : (q[1]>p[1] ? p[1]+17 : p[1]-8); lab=`<text x="${lx}" y="${ly}">${f[2]}</text>`; }
  return `<g class="fl" data-from="${f[0]}" data-to="${f[1]}"><path d="${d}"/><path d="M${last.join(' ')} L${p1.join(' ')} L${p2.join(' ')} Z" style="fill:var(--cc-ink);stroke:none"/>${lab}</g>`; }
function mapSvg(id='map', open=false){
  return `<svg class="map ${open?'open':''}" id="${id}" role="img" aria-label="Process map: Emergency purchase approval, 29 elements" viewBox="${X0} ${Y0} ${MAPW} ${MAPH}" preserveAspectRatio="xMinYMin meet">

  <g class="band"><rect x="0" y="374" width="1400" height="330" rx="8"/><text x="14" y="394">PART 2 · APPROVAL AND ORDER</text></g>
  <g class="flows">${F.map(flowSvg).join('')}</g><g class="els">${E.map(e=>elSvg(EL[e[0]])).join('')}</g></svg>`;
}
function miniSvg(){
  const r = E.map(e=>{const n=EL[e[0]]; return n.k==='t'?`<rect x="${n.x-TW/2}" y="${n.y-TH/2}" width="${TW}" height="${TH}" rx="10" fill="#fff" stroke="#0b1c30" stroke-width="4"/>`: `<circle cx="${n.x}" cy="${n.y}" r="${n.k==='g'?24:18}" fill="#fff" stroke="#0b1c30" stroke-width="4"/>`;}).join('');
  return `<svg viewBox="${X0} ${Y0} ${MAPW} ${MAPH}" aria-label="Overview map"><rect x="0" y="40" width="1400" height="322" fill="#f1f3f6"/><rect x="0" y="374" width="1400" height="330" fill="#f1f3f6"/>${r}<rect id="minivp" x="0" y="40" width="900" height="600" fill="rgb(29 78 216 / .08)" stroke="#1d4ed8" stroke-width="8"/></svg>`;
}

/* ---------- names + growing text, per frame ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shown(id){ const n=EL[id]; return (!n.ai || nameP(id,M.t)>=1) ? n.name : n.eng; }
function nameP(id,t){ const at=NAME_AT[id]; return at===undefined?0:clamp((t-at)/SWAP,0,1); }
function namedCount(t){ return AI_IDS.filter(id=>nameP(id,t)>=1).length; }
function applyNames(){
  const t=M.t;
  document.querySelectorAll('svg.map .el').forEach(g=>{ const id=g.dataset.id; if(!EL[id]||!EL[id].ai) return;
    const p=nameP(id,t); const eng=g.querySelector('.nm.eng'), fin=g.querySelector('.nm.fin');
    eng.style.opacity = 1-clamp(p/0.45,0,1); eng.style.transform=`translateY(${-3*p}px)`;
    fin.style.opacity = clamp((p-0.45)/0.55,0,1); fin.style.transform=`translateY(${-3*(1-p)}px)`;
    eng.style.display = p>=1?'none':''; fin.style.display = p<=0?'none':'';
    g.classList.toggle('swap', p>0 && p<1);
    g.querySelector('.pen').style.opacity = p;
    g.querySelector('.wt').style.display = (p===0 && t<LIMIT) ? '' : 'none';
  });
  document.querySelectorAll('[data-at]').forEach(el=>{ const on = t>=TEXT_AT[el.dataset.at]; el.classList.toggle('in',on); });
  document.querySelectorAll('[data-until]').forEach(el=>{ el.classList.toggle('out', t>=TEXT_AT[el.dataset.until]); });
  const st=document.getElementById('status'); if(st) st.outerHTML = statusLine();
}
function statusLine(){
  const t=M.t, n=namedCount(t), total=AI_IDS.length;
  if (M.complex) return `<div class="status" id="status" role="status"><span class="dotx"></span><span>Naming steps in plain language … 9 of 61</span><span class="bar"><i style="width:15%"></i></span><span class="sub">This program is larger, so naming takes up to 45 s. The map and the walk-through work now.</span></div>`;
  if (t>=LIMIT || n===total){ const kept=total-n; return `<div class="status calm" id="status" role="status"><span class="dotx"></span><span>Names are ready.${kept?` ${kept} steps kept their technical name (no pen mark).`:''}</span></div>`; }
  const sub = n<22 ? 'Names change in place as they arrive. You can start the walk-through now.' : `Waiting for ${total-n} more names, at most ${Math.max(1,Math.ceil(LIMIT-t))} s. Then they keep their technical name.`;
  return `<div class="status" id="status" role="status"><span class="dotx"></span><span>Naming steps in plain language … ${n} of ${total}</span><span class="bar"><i style="width:${Math.round(n/total*100)}%"></i></span><span class="sub">${sub}</span></div>`;
}
let raf=null;
function play(){ cancelAnimationFrame(raf); const start=performance.now()-M.t*1000; const step=(now)=>{ if(M.paused) return; M.t=(now-start)/1000; applyNames(); if(M.t<LIMIT+1) raf=requestAnimationFrame(step); }; raf=requestAnimationFrame(step); }

      <tr><td>Obsolete language (TABLES, TYPE-POOLS, FORM routines)</td><td>4</td><td><span class="lv B">B</span></td><td class="hp"><code>TABLES: eban …</code> ${A(13)}</td></tr>
      <tr><td>Reads HR data directly</td><td>1</td><td><span class="lv C">C</span></td><td class="hp"><code>FROM pa0105</code> ${A(368)}</td></tr>
      <tr><td>COMMIT WORK inside a routine</td><td>1</td><td><span class="lv C">C</span></td><td class="hp"><code>COMMIT WORK.</code> ${A(428)}</td></tr></tbody></table></div>
     <p class="sm" style="margin-top:8px"><button class="lnk">All 22 findings, as a table</button></p></section>
   <section class="card sec" aria-labelledby="i4"><h2 class="h2" id="i4">What it touches in SAP</h2><p class="lede">Every object with the statement that touches it.</p>
     <div class="tblwrap"><table class="dt"><thead><tr><th>Object</th><th>How</th><th>Statement</th><th class="hp">Line</th></tr></thead><tbody>
      <tr><td>EBAN purchase requisitions</td><td>read, <b>written directly</b></td><td><code>UPDATE eban SET statu = 'H'</code></td><td class="hp">${A(61)}${A(240)}</td></tr>
      <tr><td>LFA1, LFM1, EINA, EINE, MARC, CSKS, T16FS</td><td>read</td><td><code>SELECT SINGLE * FROM lfa1</code></td><td class="hp">${A(154)}${A(254)}${A(274)}</td></tr>
      <tr><td>PA0105 (HR communication data)</td><td>read</td><td><code>SELECT SINGLE pernr FROM pa0105</code></td><td class="hp">${A(368)}</td></tr>
      <tr><td>BAPI_PO_CREATE1, BAPI_TRANSACTION_COMMIT</td><td>called</td><td><code>CALL FUNCTION 'BAPI_PO_CREATE1'</code></td><td class="hp">${A(475)}${A(490)}</td></tr>
      <tr><td>ME21N</td><td>batch input</td><td><code>CALL TRANSACTION 'ME21N'</code></td><td class="hp">${A(515)}</td></tr>
      <tr><td>SAP_WAPI_CREATE_EVENT (BUS2105, ZAPPROVE)</td><td>called</td><td><code>CALL FUNCTION 'SAP_WAPI_CREATE_EVENT'</code></td><td class="hp">${A(421)}</td></tr>
      <tr><td>CONVERT_TO_LOCAL_CURRENCY · GUI_UPLOAD</td><td>called</td><td><code>CALL FUNCTION 'GUI_UPLOAD'</code></td><td class="hp">${A(173)}${A(129)}</td></tr>
      <tr><td>ZMM_PO_APPR, ZMM_PO_ATTACH</td><td>own tables, written</td><td><code>INSERT zmm_po_appr FROM ls_appr</code></td><td class="hp">${A(353)}${A(531)}</td></tr>
      <tr><td>ZMM_VEND_BLOCK, ZMM_DEPT_HEAD, ZMM_NOTIFY_CFG</td><td>own tables, read</td><td><code>SELECT SINGLE lifnr FROM zmm_vend_block</code></td><td class="hp">${A(222)}${A(357)}${A(383)}</td></tr>
     </tbody></table></div></section>
   <div class="row3">
    <section class="card sec" aria-labelledby="i5"><h2 class="h2" id="i5">Structure and dependencies</h2><ul class="facts">
      <li><b>Entry screen</b>: 4 parameters, the test switch on by default ${A('36–39')}</li>${''}
      <li><b>25 routines</b> (FORM), called from the main sequence ${A('41–55')}</li>
      <li><b>2 includes</b> named but not in the upload: Z_MM_PO_NOTIFY, Z_MM_PO_LOG ${A(363)}${A(396)}</li>
      <li><b>1 call</b> whose target is chosen at run time ${A(386)}</li>
      <li><b>Workflow</b>: raises event ZAPPROVE on BUS2105; the approval comes back asynchronously ${A(421)}${A(430)}</li></ul>
      ${codeBlock(36,39,0)}</section>
    <section class="card sec" aria-labelledby="i6"><h2 class="h2" id="i6">Risks for a change</h2><ul class="facts">
      <li><b>Order before approval</b>: the department head’s request counts as approved when sent ${A('432–434')}</li>
      <li><b>Test run still orders</b>: approval is simulated, the order is created ${A('407–411')}${A(337)}</li>
      <li><b>Silent breakage</b>: the batch-input fallback depends on screen 0014 of SAPLMEGUI ${A(503)}</li>
      <li><b>Hidden behaviour</b>: two includes and one dynamic call are not visible ${A(363)}${A(386)}</li></ul></section>
    <section class="card sec" aria-labelledby="i7"><h2 class="h2" id="i7">Open technical questions</h2><ul class="facts">
      <li>Add the includes Z_MM_PO_NOTIFY and Z_MM_PO_LOG ${A(363)}${A(396)}</li><li>Name the function module called at run time ${A(386)}</li>
      <li>Add ATC results. 5 local calls are not assessed</li><li>Add usage data. How often it runs is unknown</li></ul>
      <p class="sm" style="margin-top:8px"><button class="lnk">Add evidence</button></p></section>
   </div>
   ${endSection('That is the technical view.','Everything is on this page. You can stop here.', 'it')}</div>`;
}

/* ---------- full screen ---------- */
function fullScreen(){
  const edit = !!M.edit;
  const pal = [['Events',['Start event','Intermediate event','End event']],['Gateways',['Exclusive gateway','Parallel gateway']],['Tasks',['Task','Sub-process']],['Structure',['Pool','Lane']]];
  let rail='';
  if (M.stage==='tour') rail = tourCard();
  else if (M.code||M.lines) rail = codePanel();
  else if (edit && M.sel){ const n=EL[M.sel]; rail = `<section class="panel" aria-labelledby="pp"><h4 id="pp">Properties</h4>
     <label class="fld">Name<span class="in">${esc(shown(n.id))}</span><small>The name a business reader sees. The technical name stays in the file.</small></label>
     <label class="fld">Technical name<span class="in ro">BAPI_PO_CREATE1</span><small>The token in the code this element was read from. Read-only.</small></label>
     <label class="fld">Element type<span class="in">Task</span></label>
     <div class="fld">Line anchor<span>${lnBtn([n.line,n.code[0],n.code[1]])}</span></div>
     <div class="fld">Where this comes from<span class="prov">${chip.rec()} ${chip.ai()}</span></div>
     <label class="fld">Documentation<span class="in" style="min-height:56px"></span><small>Kept in the BPMN file and shown in SAP Signavio and other tools.</small></label>
     <div class="acts"><button class="btn primary">Apply</button><button class="btn ghost">Append next step</button><button class="btn ghost">Delete element</button></div></section>`; }
  else if (M.find){ const hits=focusIds(); rail = `<section class="panel"><h4>${hits.length} steps match “${M.find}”</h4><ul class="hits">${hits.map(id=>`<li><span>${shown(id)}</span>${lnBtn([EL[id].line,EL[id].code[0],EL[id].code[1]])}</li>`).join('')}</ul><p class="sm muted">Click a hit to jump to it on the map.</p></section>`; }
  else rail = `<section class="panel"><h4>Nothing selected</h4><p class="sm muted">Click a step to see its code lines${edit?' or change it':''}.</p></section>`;
  const mini = `<section class="panel mini"><h4>Overview map</h4>${miniSvg()}</section>`;
  return `<div class="fs" role="dialog" aria-label="Process map, full screen">
   <div class="fsbar" role="group" aria-label="Map tools"><span class="ttl"><small>Emergency purchase approval</small>Process · main level</span>
    <span class="fsfind ${M.find?'':'empty'}">${ic('search','s')} ${M.find?'order':'Find a step'}</span>
    <span class="vr"></span><button class="tb" data-zoom="0.8">${ic('minus','s')} Zoom out</button><span class="z" id="zoom">100%</span><button class="tb" data-zoom="1.25">${ic('plus','s')} Zoom in</button><button class="tb" data-fit>${ic('fit','s')} Fit</button><button class="tb" aria-pressed="true">${ic('map','s')} Overview map</button>
    <span class="vr"></span><button class="switch" data-edit aria-pressed="${edit}"><span class="tr"></span>Edit</button>
    ${M.stage==='tour'?'':`<button class="tb" data-start>${ic('play','s')} Walk me through it</button>`}
    <span class="sp"></span><button class="btn ghost" data-fs aria-pressed="true">${ic('min','s')} Leave full screen</button></div>
   ${edit?`<div class="fsbar" role="group" aria-label="Editor tools"><button class="tb">${ic('undo','s')} Undo</button><button class="tb" disabled>${ic('redo','s')} Redo</button><span class="vr"></span><button class="tb">${ic('grid','s')} Tidy layout</button><button class="tb">Compare with the as-is process</button><span class="vr"></span><button class="tb">Import BPMN</button><span class="fsnote">Export</span><button class="tb">${ic('dl','s')} BPMN 2.0</button><button class="tb">SVG</button><button class="tb">PNG</button><span class="sp"></span><button class="btn primary">Save as revision</button></div>
   <div class="palette" role="group" aria-label="Add elements">${pal.map(g=>`<div class="grp"><span>${g[0]}</span>${g[1].map(x=>`<button class="tb">${x}</button>`).join('')}</div>`).join('')}</div>
   <p class="fsnote">Editing a draft. The reconstructed as-is process (revision 1) stays unchanged whatever you save.</p>`:''}
   <div class="fsbody"><div class="fscanvas" id="mapcard">${mapSvg('map')}</div><div class="rail">${rail}${mini}</div></div></div>`;
}

/* ---------- render + camera ---------- */
function render(){
  document.getElementById('mock').innerHTML = `<b>MOCK-UP v4 · Analyze on the map</b>`+Object.keys(PRESETS).map(k=>`<button class="${M.key===k?'on':''}" data-preset="${k}">${PRESETS[k].d.split(':')[0]}</button>`).join('')+`<span class="d">${PRESETS[M.key].d}</span>`;
  if (M.fs){ document.getElementById('app').innerHTML = fullScreen(); }
  else {
    const content = M.view==='it' ? itView() : M.view==='management' ? mgmtView() : businessView();
    document.getElementById('app').innerHTML = shell()+`<main class="frame"><div class="headrow"><a class="back" href="#">${ic('left','s')} My workspace</a>${viewSwitch()}</div>${toolBar()}${stageHeader()}${content}</main>`;
  }
  const svg=document.getElementById('map');
  if (svg && !M.complex){ markFocus(svg); applyNames(); }
  camera();
}
function markFocus(svg){
  const ids = focusIds(); svg.classList.toggle('t', !!ids);
  svg.querySelectorAll('.el').forEach(g=>{ const h=!!ids && ids.includes(g.dataset.id); g.classList.toggle('here',h); g.classList.toggle('dim',!!ids && !h); g.classList.toggle('sel', g.dataset.id===M.code || g.dataset.id===M.sel); g.classList.toggle('prime', M.stage==='tour' && g.dataset.id===STATIONS[M.st].id); });
  svg.querySelectorAll('.fl').forEach(g=>{ const h=!!ids && ids.includes(g.dataset.from)&&ids.includes(g.dataset.to); g.classList.toggle('dim',!!ids && !h); });
}
function camera(){
  const svg=document.getElementById('map'), card=document.getElementById('mapcard'); if(!svg||!card) return;
  const W=card.clientWidth; if(!W) return;
  const vb = svg.viewBox.baseVal; const mw=vb.width, mh=vb.height;
  let s;
  if (M.fs){ const H=card.clientHeight; s = clamp(Math.min((W-4)/mw,(H-4)/mh),0.83,1.2); }
  else s = clamp((W-2)/mw, 0.83, 1.05);
  s *= M.zoom;
  const fids = M.complex ? null : focusIds();
  if (fids && W>=600 && M.zoom===1){ let a=1e9,b=-1e9,c=1e9,d=-1e9; fids.forEach(id=>{const n=EL[id]; a=Math.min(a,n.x-85); b=Math.max(b,n.x+85); c=Math.min(c,n.y-80); d=Math.max(d,n.y+90);});
    s = Math.min(s, Math.max(0.6,(W-8)/(b-a))); if (M.fs) s = Math.min(s, Math.max(0.6,(card.clientHeight-8)/(d-c))); }
  svg.style.width = Math.round(mw*s)+'px'; svg.style.height = Math.round(mh*s)+'px';
  const z=document.getElementById('zoom'); if(z) z.textContent=Math.round(s*100)+'%';
  const ids = M.complex ? null : (focusIds() || (M.code?[M.code]:M.sel?[M.sel]:null));
  if (ids){
    const prime = M.stage==='tour' ? STATIONS[M.st].id : null;
    let x1=1e9,x2=-1e9,y1=1e9,y2=-1e9; (W<600 && prime ? [prime] : ids).forEach(id=>{ const n=EL[id]; x1=Math.min(x1,n.x-80); x2=Math.max(x2,n.x+80); y1=Math.min(y1,n.y-70); y2=Math.max(y2,n.y+80); });
    card.scrollLeft = clamp(((x1+x2)/2 - vb.x)*s - W/2, 0, card.scrollWidth-W);
    if (M.fs) card.scrollTop = clamp(((y1+y2)/2 - vb.y)*s - card.clientHeight/2, 0, card.scrollHeight-card.clientHeight);
  } else { card.scrollLeft = 0; card.scrollTop = 0; }
  const mv=document.getElementById('minivp'); if(mv){ mv.setAttribute('x', vb.x + card.scrollLeft/s); mv.setAttribute('y', vb.y + card.scrollTop/s); mv.setAttribute('width', Math.min(mw, W/s)); mv.setAttribute('height', Math.min(mh, card.clientHeight/s)); }
}

document.addEventListener('click',e=>{
  const elg = e.target.closest && e.target.closest('svg.map .el');
  if (elg && !M.complex){ M.code=elg.dataset.id; M.lines=null; if(M.edit) M.sel=elg.dataset.id; render(); return; }
  const t=e.target.closest('button,a'); if(!t) return;
  if(t.dataset.preset){ setPreset(t.dataset.preset); return; }
  e.preventDefault();
  if(t.dataset.view){ if(t.dataset.view!==M.view){ M.view=t.dataset.view; if(!walked()) M.skipped=true; } render(); window.scrollTo(0,0); return; }
  if(t.dataset.tool){ if(!walked()){ M.note=t.dataset.tool; render(); } return; }
  if(t.dataset.lines){ M.lines=t.dataset.lines; M.code=null; render(); return; }
  if(t.dataset.hl){ M.hl = M.hl===t.dataset.hl?null:t.dataset.hl; render(); if(M.hl) document.getElementById('mapcard').scrollIntoView({block:'center'}); return; }
  if(t.dataset.zoom){ M.zoom*=+t.dataset.zoom; camera(); return; }
  if(t.hasAttribute('data-fit')){ M.zoom=1; camera(); return; }
  if(t.hasAttribute('data-clearhl')){ M.hl=null; render(); return; }
  if(t.hasAttribute('data-fs')){ M.fs=!M.fs; M.zoom=1; render(); return; }
  if(t.hasAttribute('data-edit')){ M.edit=!M.edit; render(); return; }
  if(t.hasAttribute('data-closecode')){ M.code=null; M.lines=null; render(); return; }
  if(t.hasAttribute('data-hidenext')){ M.nextHidden=true; localStorage.setItem(NEXT_KEY,'1'); render(); return; }
  if(t.hasAttribute('data-shownext')){ M.nextHidden=false; M.nextOpen=true; localStorage.removeItem(NEXT_KEY); render(); return; }
  if(t.hasAttribute('data-togglenext')){ M.nextOpen=!M.nextOpen; render(); return; }
  if(t.hasAttribute('data-closenote')){ M.note=null; render(); return; }
  if(t.hasAttribute('data-start')){ M.view='business'; M.stage='tour'; M.st=0; M.note=null; M.code=null; M.lines=null; M.hl=null; render(); return; }
  if(t.hasAttribute('data-self')){ M.stage='look'; render(); return; }
  if(t.hasAttribute('data-next')){ M.st=Math.min(STATIONS.length-1,M.st+1); M.code=null; M.lines=null; render(); return; }
  if(t.hasAttribute('data-back')){ M.st=Math.max(0,M.st-1); M.code=null; M.lines=null; render(); return; }
  if(t.hasAttribute('data-pausetour')){ M.stage='ready'; render(); return; }
  if(t.hasAttribute('data-finish')){ M.stage='done'; render(); return; }
});
window.addEventListener('resize',camera);
const h=new URLSearchParams(location.hash.slice(1)); if(h.get('embed')==='1') document.body.classList.add('embed');
setPreset(PRESETS[h.get('state')]?h.get('state'):'play');
</script>
