<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentation, next · mock-up v1</title>
<style>
/* =====================================================================
   Mock-up, not product code. The Documentation tool in the line of 3.5
   (Analyze business first, v4.1; home v2.1): answer first, one way to
   jump, the process as the canvas, each fact once, lists folded with
   counts, evidence as quiet chips, one primary action (Export), no inputs.
   Look: the tokens and components of the Analyze v4.1 mock-up
   (app/globals.css, StageHeader, ToolBar, StageViewSwitch, cc chips).
   Content: the shipped demo Z_MM_PO_APPROVAL (synthetic, 552 lines).
   Font: the app's own Inter by relative path (app/fonts), system fallback.
   ===================================================================== */
@font-face{font-family:Inter;src:url(../../app/fonts/inter-latin-variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{
  --cc-page:#f8f9ff;--cc-surface:#fff;--cc-surface-muted:#f9fafb;--cc-ink:#0b1c30;--cc-ink-muted:#4b5563;--cc-line:#e5e7eb;--cc-field-border:#6b7280;
  --cc-brand:#16a34a;--cc-brand-strong:#15803d;--cc-brand-deep:#006b2c;--cc-brand-surface:#f0fdf4;--cc-focus:#1d4ed8;
  --cc-success:#047857;--cc-success-bg:#ecfdf5;--cc-success-border:#a7f3d0;
  --cc-warning:#92400e;--cc-warning-bg:#fffbeb;--cc-warning-border:#fde68a;--cc-warning-line:#b45309;--cc-warning-mark:#d97706;
  --cc-error:#b91c1c;--cc-error-bg:#fef2f2;--cc-error-border:#fecaca;
  --cc-information:#1d4ed8;--cc-information-bg:#eff6ff;--cc-information-border:#bfdbfe;
  --cc-neutral:#4b5563;--cc-neutral-bg:#f9fafb;--cc-neutral-border:#e5e7eb;
  --cc-code-bg:#030712;--cc-code-ink:#e5e7eb;--cc-code-muted:#9ca3af;--cc-code-keyword:#c4b5fd;--cc-code-literal:#fcd34d;--cc-code-name:#93c5fd;
  --cc-cat-1:#1e3a8a;--cc-cat-2:#0f766e;--cc-cat-3:#7c3aed;
  --cc-radius-card:12px;--cc-shadow:0 1px 2px rgb(0 0 0 / .04);
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cc-page);font-family:var(--sans);font-size:14px;color:var(--cc-ink);-webkit-font-smoothing:antialiased}
p{margin:0}h1,h2,h3,h4{margin:0}ul,ol{margin:0;padding:0;list-style:none}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--cc-focus);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
svg.i.s{width:12px;height:12px}

/* ---------- doc chrome (not product) ---------- */
.mock{position:sticky;top:0;z-index:200;background:#1f1147;color:#fff;font-size:12px;padding:6px 16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mock b{font-weight:700;margin-right:6px}
.mock button{background:transparent;border:1px solid #6d5bb8;color:#e9e5ff;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}
.mock button.on{background:#e9e5ff;color:#1f1147}
.mock .sep{width:1px;height:18px;background:#6d5bb8;margin:0 4px}
.mock .d{flex-basis:100%;color:#cfc8f3;font-weight:500;padding-top:2px}
body.embed .mock{display:none}
.mtag{display:inline-flex;font-size:11px;font-weight:600;color:#5b21b6;background:#f5f3ff;border:1px dashed #a78bfa;border-radius:4px;padding:0 5px;white-space:nowrap}

/* ---------- shell bar ---------- */
.shell{height:56px;display:flex;align-items:center;gap:20px;padding:0 24px;background:var(--cc-surface);border-bottom:1px solid var(--cc-line)}
.logo{display:flex;align-items:center;gap:9px;flex:none}
.logo .lg{width:32px;height:32px;border-radius:8px;background:var(--cc-brand-surface);color:var(--cc-brand);display:flex;align-items:center;justify-content:center}
.logo .n{display:block;font-weight:800;font-size:16px;letter-spacing:-.02em;line-height:1.15}
.logo .n em{font-style:normal;color:var(--cc-brand)}
.logo .s{display:block;font-size:11px;font-weight:500;color:var(--cc-ink-muted)}
.path{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--cc-ink-muted);white-space:nowrap;min-width:0;overflow:hidden}
.path .cur{color:var(--cc-ink);font-weight:600}
.shell-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--cc-field-border);background:#fff;color:var(--cc-ink-muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.av{width:28px;height:28px;border-radius:8px;background:var(--cc-ink);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}

/* ---------- frame, header, tools ---------- */
.frame{max-width:1536px;margin:0 auto;padding:16px 32px 40px}
.headrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--cc-ink-muted);text-decoration:none}
.vs{margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--cc-field-border);border-radius:8px;padding:2px;background:#fff}
.seg button{border:0;background:transparent;padding:4px 12px;font-size:13px;font-weight:600;color:var(--cc-ink-muted);border-radius:6px;min-height:28px}
.seg button.on{background:var(--cc-ink);color:#fff}
.tools{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.tools .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--cc-ink-muted);margin-right:4px}
.tool{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--cc-ink);border:1px solid var(--cc-line);background:#fff;border-radius:8px;padding:5px 10px;min-height:32px;text-decoration:none}
.tool.cur{background:var(--cc-ink);border-color:var(--cc-ink);color:#fff}
.tool .ck{color:var(--cc-success)}
.tool.cur .ck{color:#a7f3d0}
.tools .toolsmenu{display:none}
.sh{display:flex;align-items:flex-end;gap:16px;margin-top:14px;flex-wrap:wrap}
.sh .t{min-width:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--cc-ink-muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sh h1{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-top:4px;display:flex;align-items:center;gap:8px}
.sh h1 svg{color:var(--cc-ink-muted);width:20px;height:20px}
.sh .acts{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sh .note{font-size:12px;font-weight:500;color:var(--cc-ink-muted)}

/* ---------- cc components ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;line-height:1.1;border-radius:8px;padding:8px 12px;min-height:32px;border:1px solid transparent;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--cc-brand-strong);border-color:var(--cc-brand-strong);color:#fff}
.btn.primary[aria-expanded=true]{background:var(--cc-brand-deep)}
.btn.secondary{background:var(--cc-brand-surface);border-color:var(--cc-brand-strong);color:var(--cc-brand-strong)}
.btn.ghost{background:#fff;border-color:var(--cc-field-border);color:var(--cc-ink-muted)}
.btn.lg{min-height:40px;font-size:14px;padding:10px 16px}
.lnk{font-size:13px;font-weight:600;color:var(--cc-ink);text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0;cursor:pointer}
.lnk.q{font-weight:500;color:var(--cc-ink-muted)}
.pv{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;line-height:16px;padding:1px 8px 1px 6px;border-radius:999px;border:1px solid;white-space:nowrap;vertical-align:middle;background:#fff}
.pv svg.i{width:12px;height:12px}
.pv{text-transform:none;letter-spacing:0}
.pv.rec{color:var(--cc-information);border-color:var(--cc-information)}
.pv.ai{color:var(--cc-warning);border-color:var(--cc-warning-line);border-style:dashed}
.pv.nd{color:var(--cc-neutral);border-color:var(--cc-neutral)}
.pv.ok{color:var(--cc-success);border-color:var(--cc-success)}
.card{background:#fff;border:1px solid var(--cc-line);border-radius:12px;box-shadow:var(--cc-shadow);min-width:0}
.pad{padding:16px 20px}
.muted{color:var(--cc-ink-muted)}
.sm{font-size:13px}
.xs{font-size:12px}
.k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--cc-ink-muted)}
.h2{font-size:15px;font-weight:700}
.h3{font-size:14px;font-weight:700}
/* evidence: quiet chips; the full anchor in the tooltip */
.anc{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--cc-information);background:var(--cc-information-bg);border:1px solid var(--cc-information-border);border-radius:4px;padding:0 5px;line-height:17px;margin:0 2px 0 0;white-space:nowrap;vertical-align:1px;cursor:pointer}
.br{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--cc-ink-muted);border:1px solid var(--cc-line);border-radius:4px;padding:0 5px;line-height:17px;white-space:nowrap;vertical-align:1px;background:var(--cc-surface-muted)}
.tech{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--cc-ink-muted);white-space:nowrap}
.ev{display:none}
body.v-it .ev{display:inline}
body.v-it .ev-b{display:inline-block}
.ev-b{display:none}

/* ---------- where you are: depth + one navigation ---------- */
.nav{display:flex;align-items:stretch;gap:2px;margin-top:16px;border-bottom:1px solid var(--cc-line);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 9px;font-size:13px;font-weight:600;color:var(--cc-ink-muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;margin-bottom:-1px}
.nav button.on{color:var(--cc-ink);border-bottom-color:var(--cc-ink)}
.nav .cnt{font-size:11px;font-weight:700;color:var(--cc-ink-muted);background:var(--cc-surface-muted);border:1px solid var(--cc-line);border-radius:999px;padding:0 6px;line-height:16px}
.nav .cnt.open{color:var(--cc-warning);border-color:var(--cc-warning-border);background:var(--cc-warning-bg)}
.depth{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px;font-weight:500;color:var(--cc-ink-muted)}
.depth .crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.depth .crumb b{color:var(--cc-ink);font-weight:600}
.depth .meter{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.depth .meter i{display:block;width:22px;height:6px;border-radius:3px;background:var(--cc-line)}
.depth .meter i.on{background:var(--cc-ink)}

/* ---------- the answer ---------- */
.answer{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px 28px;align-items:start;margin-top:12px;padding:18px 22px}
.answer h2{font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.3;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.answer .prog{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--cc-ink-muted);margin-top:2px}
.answer .say{font-size:15px;line-height:1.55;font-weight:500;margin-top:10px;max-width:820px}
.answer .say + .say{margin-top:4px}
.answer .start{font-size:13px;color:var(--cc-ink-muted);margin-top:8px;line-height:1.5}
.answer .start b{color:var(--cc-ink);font-weight:600}
.answer.one{grid-template-columns:minmax(0,1fr)}
.cover{border-left:1px solid var(--cc-line);padding-left:24px}
.cover h3{font-size:13px;font-weight:700;margin-bottom:6px}
.cover li{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;padding:2px 0}
.cover li svg{margin-top:2px}
.cover li.y svg{color:var(--cc-success)}
.cover li.n svg{color:var(--cc-neutral)}
.cover .foot{margin-top:8px;font-size:12px;color:var(--cc-ink-muted)}

/* ---------- canvas: the process as tiles ---------- */
.blk{margin-top:16px}
.blk-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.blk-h .h2{display:flex;gap:8px;align-items:center}
.blk-h .r{margin-left:auto;display:flex;gap:12px;align-items:center}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;counter-reset:st}
.tile{position:relative;text-align:left;background:#fff;border:1px solid var(--cc-line);border-radius:10px;padding:10px 12px 10px;min-height:84px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--cc-shadow)}
.tile:hover{border-color:var(--cc-field-border)}
.tile.sel{border-color:var(--cc-ink);box-shadow:inset 0 0 0 1px var(--cc-ink)}
.tile .no{display:inline-flex;width:20px;height:20px;border-radius:999px;background:var(--cc-ink);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;flex:none}
.tile .nm{font-size:13px;font-weight:600;line-height:1.35}
.tile .top{display:flex;gap:8px;align-items:flex-start}
.tile .meta{margin-top:auto;display:flex;gap:8px;align-items:center;font-size:11px;font-weight:600;color:var(--cc-ink-muted);flex-wrap:wrap}
.tile .meta span{display:inline-flex;gap:3px;align-items:center}
.tile .gate{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:600;color:var(--cc-ink);background:var(--cc-surface-muted);border:1px solid var(--cc-line);border-radius:6px;padding:2px 6px}
.tile .gate i{width:9px;height:9px;border:1.5px solid var(--cc-ink);transform:rotate(45deg);display:block;flex:none}
.tile .arrow{position:absolute;right:-10px;top:50%;width:10px;height:1px;background:var(--cc-field-border)}
.flowfoot{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:500;color:var(--cc-ink-muted)}

/* ---------- insight cards ---------- */
.ins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.icard{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.icard .lbl{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cc-warning)}
.icard .lbl.info{color:var(--cc-information)}
.icard h3{font-size:14px;font-weight:700;line-height:1.35}
.icard p{font-size:13px;line-height:1.5;color:var(--cc-ink-muted)}
.icard .ft{margin-top:auto;padding-top:4px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}

/* ---------- step chapter (canvas + chapter beside) ---------- */
.cv{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;margin-top:12px;align-items:start}
.rail{padding:8px;position:sticky;top:44px}
.rail li button{width:100%;display:flex;gap:8px;align-items:flex-start;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:500;line-height:1.35}
.rail li button:hover{background:var(--cc-surface-muted)}
.rail li button.on{background:var(--cc-information-bg);font-weight:700}
.rail .no{display:inline-flex;width:18px;height:18px;border-radius:999px;border:1px solid var(--cc-field-border);font-size:10px;font-weight:700;align-items:center;justify-content:center;flex:none;margin-top:1px}
.rail button.on .no{background:var(--cc-ink);color:#fff;border-color:var(--cc-ink)}
.rail .g{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:600;color:var(--cc-ink-muted);padding:2px 8px 2px 32px}
.rail .g i{width:8px;height:8px;border:1.5px solid var(--cc-ink-muted);transform:rotate(45deg);display:block}
.chap{padding:18px 22px}
.chap-h{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.chap-h .pos{font-size:12px;font-weight:600;color:var(--cc-ink-muted)}
.chap-h h2{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.3;margin-top:2px}
.chap-h .pn{margin-left:auto;display:flex;gap:6px}
.mini{display:flex;align-items:center;gap:3px;margin-top:12px}
.mini button{flex:1;height:8px;border-radius:4px;border:0;background:var(--cc-line);padding:0}
.mini button.past{background:#9ca3af}
.mini button.on{background:var(--cc-ink);height:12px}
.mini i{width:8px;height:8px;border:1.5px solid var(--cc-ink-muted);transform:rotate(45deg);flex:none;display:block;margin:0 2px}
.minil{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--cc-ink-muted);margin-top:4px}
.chap .one{font-size:15px;line-height:1.55;font-weight:500;margin-top:10px;max-width:760px}
.facts{margin-top:14px;border-top:1px solid var(--cc-line)}
.fr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--cc-line);align-items:start}
.fr .fk{font-size:12px;font-weight:600;color:var(--cc-ink-muted);padding-top:1px;display:flex;gap:6px;align-items:center}
.fr ul{display:flex;flex-direction:column;gap:5px}
.fr li{font-size:13px;line-height:1.45}
.fr .none{font-size:13px;color:var(--cc-ink-muted)}
.objs{display:flex;flex-wrap:wrap;gap:6px}
.obj{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;border:1px solid var(--cc-line);border-radius:6px;padding:2px 8px;background:#fff}
.obj.w{border-color:var(--cc-ink)}
.obj .tech{font-size:10px}
details.fold{margin-top:12px;border:1px solid var(--cc-line);border-radius:10px;background:#fff}
details.fold > summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary .chev{transition:transform .15s;color:var(--cc-ink-muted)}
details.fold[open] > summary .chev{transform:rotate(90deg)}
details.fold > summary .r{margin-left:auto;font-weight:500;color:var(--cc-ink-muted);font-size:12px}
details.fold .in{padding:0 14px 12px}
.code{background:var(--cc-code-bg);color:var(--cc-code-ink);font-family:var(--mono);font-size:12px;border-radius:8px;padding:6px 0;line-height:1.6;overflow-x:auto}
.code .l{display:flex;white-space:pre}
.code .l .no{width:40px;text-align:right;color:var(--cc-code-muted);padding-right:10px;flex:none}
.code .l .tx{padding-right:12px}
.code .l.hl{background:rgb(59 130 246 / .22);box-shadow:inset 3px 0 0 var(--cc-code-name)}
.code .kw{color:var(--cc-code-keyword)}.code .lit{color:var(--cc-code-literal)}.code .cm{color:var(--cc-code-muted)}
.stepnav{display:none}
.stepall{display:none}
.railin li button{width:100%;display:flex;gap:8px;align-items:flex-start;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:500}
.railin li button.on{background:var(--cc-information-bg);font-weight:700}
.railin .no{display:inline-flex;width:18px;height:18px;border-radius:999px;border:1px solid var(--cc-field-border);font-size:10px;font-weight:700;align-items:center;justify-content:center;flex:none}
.railin .g{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:600;color:var(--cc-ink-muted);padding:2px 8px 2px 32px}
.railin .g i{width:8px;height:8px;border:1.5px solid var(--cc-ink-muted);transform:rotate(45deg);display:block}

/* ---------- roles & controls ---------- */
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;margin-top:12px;align-items:start}
.raci{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;margin-top:10px}
.raci th{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--cc-ink-muted);text-align:center;padding:6px 4px;border-bottom:1px solid var(--cc-line);white-space:nowrap}
.raci th:first-child{text-align:left}
.raci .abbr{display:none}
.raci td{padding:6px 4px;border-bottom:1px solid var(--cc-line);text-align:center}
.raci td:first-child{text-align:left;font-weight:500}
.raci td:first-child .no{display:inline-flex;width:18px;height:18px;border-radius:999px;border:1px solid var(--cc-field-border);font-size:10px;font-weight:700;align-items:center;justify-content:center;margin-right:6px}
.L{display:inline-flex;width:22px;height:22px;border-radius:5px;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.L.R{background:var(--cc-cat-1);color:#fff}
.L.A{background:var(--cc-cat-3);color:#fff}
.L.C{border:1.5px solid var(--cc-cat-2);color:var(--cc-cat-2)}
.L.I{border:1.5px dashed var(--cc-ink-muted);color:var(--cc-ink-muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--cc-ink-muted);align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend .L{width:18px;height:18px;font-size:10px}
.hide-l{display:none!important}
@media (max-width:767px){ .legend .hide-l{display:inline-flex!important;flex-basis:100%} }
.chk li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--cc-line);font-size:13px;line-height:1.45}
.chk li:last-child{border-bottom:0}
.chk li > svg{margin-top:2px;color:var(--cc-success)}
.chk li.warn > svg{color:var(--cc-warning-mark)}
.chk .t{font-weight:600}
.chk .s{color:var(--cc-ink-muted)}
.provline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--cc-ink-muted)}
.strip{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--cc-information-border);background:var(--cc-information-bg);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:500;line-height:1.5;margin-top:12px}
.strip svg{color:var(--cc-information);margin-top:2px}

/* ---------- open questions as a checklist ---------- */
.oqtop{margin-top:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 18px}
.oqbar{display:flex;height:8px;border-radius:4px;overflow:hidden;flex:1 1 220px;max-width:420px;background:var(--cc-line)}
.oqbar i{display:block;height:100%}
.oq{margin-top:12px}
.oqg{border-top:1px solid var(--cc-line)}
.oqg:first-child{border-top:0}
.oqg > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 18px}
.oqg > summary::-webkit-details-marker{display:none}
.oqg .ring{color:var(--cc-neutral);display:flex}
.oqg .ttl{font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.oqg .ttl .c{font-size:12px;font-weight:600;color:var(--cc-ink-muted)}
.oqg .sub{font-size:13px;color:var(--cc-ink-muted);margin-top:2px;font-weight:500}
.oqg .rt{display:flex;gap:6px;align-items:center}
.who{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--cc-line);background:var(--cc-surface-muted);color:var(--cc-ink)}
.blocks{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--cc-warning-border);background:var(--cc-warning-bg);color:var(--cc-warning)}
.oqg .body{padding:0 18px 14px 50px;font-size:13px;line-height:1.5}
.oqg .body p + p{margin-top:6px}
.limits{margin-top:10px;font-size:12px;color:var(--cc-ink-muted);display:flex;gap:6px;align-items:flex-start}

/* ---------- export ---------- */
.xp{position:relative;margin-top:12px;padding:18px 22px;border-color:var(--cc-brand-strong)}
.fmt.wide{grid-column:1 / -1}
.xp-h{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.xp-h p{font-size:13px;color:var(--cc-ink-muted);margin-top:3px;max-width:720px;line-height:1.5}
.xp-h .x{position:absolute;top:12px;right:12px;padding:6px}
.xp-h > div{padding-right:44px}
.xpgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;margin-top:14px}
.fmts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fmt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--cc-line);border-radius:10px;padding:12px 14px}
.fmt:hover{border-color:var(--cc-brand-strong);background:var(--cc-brand-surface)}
.fmt .ic{width:34px;height:34px;border-radius:8px;background:var(--cc-surface-muted);border:1px solid var(--cc-line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--cc-ink)}
.fmt .nm{font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center}
.fmt .ds{font-size:12px;color:var(--cc-ink-muted);line-height:1.45;margin-top:2px}
.fmt .dl{margin-left:auto;color:var(--cc-brand-strong);align-self:center}
.outline h3{font-size:13px;font-weight:700}
.outline ol{margin-top:6px;counter-reset:o}
.outline li{display:flex;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--cc-line);line-height:1.4}
.outline li .c{margin-left:auto;font-size:12px;color:var(--cc-ink-muted);white-space:nowrap}
.outline .yours{margin-top:10px;font-size:12px;color:var(--cc-ink-muted);line-height:1.5;border:1px dashed var(--cc-field-border);border-radius:8px;padding:8px 10px}
.done{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--cc-success);margin-top:12px}

/* ---------- evidence ---------- */
.evlist details.fold{margin-top:8px}
.evtable{width:100%;border-collapse:collapse;font-size:13px}
.evtable th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--cc-ink-muted);padding:6px 8px;border-bottom:1px solid var(--cc-line)}
.evtable td{padding:6px 8px;border-bottom:1px solid var(--cc-line);vertical-align:top}

/* ---------- building / empty ---------- */
.status{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;background:#fff;border:1px solid var(--cc-line);border-radius:8px;padding:9px 14px;margin-top:12px;font-size:13px;font-weight:500}
.status .bar{flex:0 0 140px;height:4px;background:var(--cc-line);border-radius:2px;overflow:hidden}
.status .bar i{display:block;height:100%;background:var(--cc-ink)}
.status .sub{color:var(--cc-ink-muted);font-size:12px}
.status .dotx{width:8px;height:8px;border-radius:999px;background:var(--cc-information);flex:none;animation:pulse 1.2s ease-in-out infinite}
.status .stg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--cc-ink-muted)}
.status .stg span{display:inline-flex;gap:4px;align-items:center}
.status .stg .d{color:var(--cc-success)}
@keyframes pulse{50%{opacity:.35}}
.wait{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#eef0f3,#f6f7f9,#eef0f3)}
.skt{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.skt div{height:96px;border-radius:10px;border:1px dashed var(--cc-line);background:var(--cc-surface-muted)}
.empty{max-width:720px;margin:28px auto 0;padding:28px;text-align:left}
.empty h2{font-size:18px;font-weight:800}
.empty p{font-size:14px;line-height:1.55;color:var(--cc-ink-muted);margin-top:6px}
.empty ul{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.empty li{display:flex;gap:8px;font-size:13px;align-items:flex-start}
.empty li svg{color:var(--cc-ink-muted);margin-top:2px}
.empty .acts{margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ---------- management density ---------- */
.mgmt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.mfig{padding:14px 16px}
.mfig .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.mfig .v small{font-size:14px;font-weight:600;color:var(--cc-ink-muted)}
.mfig p{font-size:13px;color:var(--cc-ink-muted);margin-top:4px;line-height:1.45}
.mlist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--cc-line);font-size:13px;line-height:1.45}
.mlist li:last-child{border-bottom:0}
.mlist li svg{color:var(--cc-warning-mark);margin-top:2px}
.mlist .r{margin-left:auto;white-space:nowrap}
.quiet{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;margin-top:16px;font-size:13px;color:var(--cc-ink-muted)}
.quiet b{color:var(--cc-ink);font-weight:600}

/* ---------- breakpoints ---------- */
@media (min-width:1280px){ .flow{grid-template-columns:repeat(6,minmax(0,1fr))} }
@media (max-width:1279px){
  .answer{grid-template-columns:minmax(0,1fr)}
  .cover{border-left:0;padding-left:0;border-top:1px solid var(--cc-line);padding-top:12px}
  .cover ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
}
@media (max-width:1023px){
  .two,.xpgrid{grid-template-columns:minmax(0,1fr)}
  .ins{grid-template-columns:minmax(0,1fr)}
  .cv{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .stepnav{display:flex;gap:8px;align-items:center;margin-top:12px}
  .stepall{display:block}
  .chap-h .pos{display:none}
  .mgmt{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:767px){
  .shell{padding:0 16px;gap:12px}
  .shell .path span:not(.cur),.shell .path svg{display:none}
  .logo .s{display:none}
  .shell-r .ib.hide-s{display:none}
  .frame{padding:12px 16px 32px}
  .tools .tool{display:none}
  .tools .k{display:none}
  .tools .toolsmenu{display:inline-flex}
  .vs{margin-left:0}
  .headrow .back .w{display:none}
  .sh .acts{margin-left:0;width:100%}
  .sh .acts .btn.primary{flex:1}
  .answer{padding:16px}
  .answer h2{font-size:18px}
  .answer .say{font-size:14px}
  .cover ul{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:minmax(0,1fr);gap:6px}
  .tile{min-height:0;flex-direction:row;align-items:center;flex-wrap:wrap;padding:8px 10px}
  .tile .top{flex:1 1 auto;align-items:center}
  .tile .meta{margin-top:0;margin-left:auto}
  .tile .gate{flex-basis:100%}
  .tile .arrow{display:none}
  .skt{grid-template-columns:minmax(0,1fr);gap:6px}
  .skt div{height:44px}
  .chap{padding:16px}
  .chap-h .pn{display:none}
  .fr{grid-template-columns:minmax(0,1fr);gap:4px}
  .fmts{grid-template-columns:minmax(0,1fr)}
  .xp{padding:16px}
  .oqg > summary{padding:12px 14px;grid-template-columns:18px minmax(0,1fr)}
  .oqg .rt{grid-column:2;flex-wrap:wrap}
  .oqg .body{padding:0 14px 12px 42px}
  .depth .meter{margin-left:0}
  .raci .full{display:none}
  .raci .abbr{display:inline}
  .raci td:first-child{min-width:150px}
  .two .card.pad{padding:14px}
  .hide-s{display:none}
}
@media (prefers-reduced-motion: reduce){ .status .dotx{animation:none} }

<script>
const SRC = ["*&---------------------------------------------------------------------*", "*& Report  Z_MM_PO_APPROVAL", "*& Emergency purchase approval", "*&---------------------------------------------------------------------*", "*& Fictional but realistic MM example for Clean-Core.io:", "*& purchase requisition check, vendor block list, price tolerance", "*& against the purchasing info record, approval by department head", "*& or manager, purchase order via BAPI with batch-input fallback.", "*& Synthetic input only - not for productive SAP import.", "*&---------------------------------------------------------------------*", "REPORT z_mm_po_approval MESSAGE-ID zmm_po.", "", "TABLES: eban, eina, eine, lfa1, lfm1, t16fs, csks, zmm_vend_block, zmm_po_appr.", "", "TYPE-POOLS: abap.", "", "CONSTANTS: c_doc_type      TYPE esart VALUE 'NB',", "           c_release_group TYPE frggr VALUE 'ZE',", "           c_purch_org     TYPE ekorg VALUE '1000'.", "", "DATA: gs_eban       TYPE eban,", "      gs_lfa1       TYPE lfa1,", "      gv_amount     TYPE bapicurext,", "      gv_ref_price  TYPE bapicurext,", "      gv_emergency  TYPE abap_bool,", "      gv_skip_limit TYPE abap_bool,", "      gv_rejected   TYPE abap_bool,", "      gv_on_hold    TYPE abap_bool,", "      gv_approved   TYPE abap_bool,", "      gv_approver   TYPE xubname,", "      gv_ebeln      TYPE ebeln,", "      gv_message    TYPE char255,", "      gt_return     TYPE STANDARD TABLE OF bapiret2 WITH DEFAULT KEY.", "", "SELECTION-SCREEN BEGIN OF BLOCK b01 WITH FRAME TITLE text-001.", "PARAMETERS: p_banfn TYPE eban-banfn OBLIGATORY DEFAULT '0010000001',", "            p_bnfpo TYPE eban-bnfpo DEFAULT '00010',", "            p_file  TYPE string LOWER CASE,", "            p_test  AS CHECKBOX DEFAULT 'X'.", "SELECTION-SCREEN END OF BLOCK b01.", "START-OF-SELECTION.", "  PERFORM check_authority.", "  PERFORM read_requisition.", "  PERFORM check_requisition.", "  CHECK gv_rejected = abap_false.", "  PERFORM upload_attachment.", "  PERFORM read_vendor.", "  PERFORM check_vendor.", "  CHECK gv_rejected = abap_false.", "  PERFORM read_info_record.", "  PERFORM check_price.", "  CHECK gv_on_hold = abap_false.", "  PERFORM decide_approval.", "  PERFORM notify_requester.", "  PERFORM write_result_list.", "", "*&---------------------------------------------------------------------*", "*&      Form  READ_REQUISITION", "*&---------------------------------------------------------------------*", "FORM read_requisition.", "  SELECT SINGLE * FROM eban INTO gs_eban", "    WHERE banfn = p_banfn", "      AND bnfpo = p_bnfpo", "      AND loekz = space.", "  IF sy-subrc <> 0.", "    MESSAGE e001 WITH 'Purchase requisition not found' p_banfn.", "  ENDIF.", "  gv_amount = gs_eban-menge * gs_eban-preis / gs_eban-peinh.", "  IF gs_eban-waers <> 'EUR'.", "    PERFORM convert_to_eur USING gs_eban-waers CHANGING gv_amount.", "  ENDIF.", "  IF gs_eban-dispo = 'EMG' OR gs_eban-bednr CP 'EMERG*'.", "    gv_emergency = abap_true.", "  ENDIF.", "ENDFORM.", "", "FORM check_requisition.", "  IF gs_eban-matnr IS INITIAL.", "    PERFORM reject USING 'Material missing on the requisition'.", "    RETURN.", "  ENDIF.", "  IF gs_eban-frgkz = 'X'.", "    PERFORM reject USING 'Requisition is blocked for release'.", "    RETURN.", "  ENDIF.", "  PERFORM check_material_status.", "  IF gv_rejected = abap_true.", "    RETURN.", "  ENDIF.", "  PERFORM check_account_assignment.", "  IF gv_rejected = abap_true.", "    RETURN.", "  ENDIF.", "  \"Plant 1000 is the central warehouse", "  IF gs_eban-werks = '1000'.", "    gv_skip_limit = abap_true.", "  ENDIF.", "ENDFORM.", "", "*&---------------------------------------------------------------------*", "*&      Form  CHECK_AUTHORITY", "*&---------------------------------------------------------------------*", "FORM check_authority.", "  DATA lv_ekgrp TYPE eban-ekgrp.", "", "  SELECT SINGLE ekgrp FROM eban INTO lv_ekgrp", "    WHERE banfn = p_banfn", "      AND bnfpo = p_bnfpo.", "  IF sy-subrc <> 0.", "    MESSAGE e001 WITH 'Purchase requisition not found' p_banfn.", "  ENDIF.", "", "  \"Only the purchasing group of the requisition may approve", "  \"(emergency procurement, ticket MM-2211)", "", "  AUTHORITY-CHECK OBJECT 'M_BANF_EKG'", "    ID 'ACTVT' FIELD '02'", "    ID 'EKGRP' FIELD lv_ekgrp.", "  IF sy-subrc <> 0.", "    MESSAGE e002 WITH 'No authorization for purchasing group' lv_ekgrp.", "  ENDIF.", "ENDFORM.", "", "FORM upload_attachment.", "  DATA lt_bin TYPE STANDARD TABLE OF solix WITH DEFAULT KEY.", "  DATA lv_length TYPE i.", "", "  CHECK p_file IS NOT INITIAL.", "  CALL FUNCTION 'GUI_UPLOAD'", "    EXPORTING", "      filename   = p_file", "      filetype   = 'BIN'", "    IMPORTING", "      filelength = lv_length", "    TABLES", "      data_tab   = lt_bin", "    EXCEPTIONS", "      file_open_error = 1", "      file_read_error = 2", "      OTHERS          = 3.", "  IF sy-subrc <> 0.", "    MESSAGE w003 WITH 'Attachment could not be read:' p_file.", "  ELSE.", "    PERFORM store_attachment TABLES lt_bin USING lv_length.", "  ENDIF.", "ENDFORM.", "", "*&---------------------------------------------------------------------*", "*&      Form  READ_VENDOR", "*&---------------------------------------------------------------------*", "FORM read_vendor.", "  DATA ls_lfm1 TYPE lfm1.", "", "  SELECT SINGLE * FROM lfa1 INTO gs_lfa1", "    WHERE lifnr = gs_eban-flief.", "  IF sy-subrc <> 0.", "    PERFORM reject USING 'Fixed vendor missing on the requisition'.", "    RETURN.", "  ENDIF.", "", "  SELECT SINGLE * FROM lfm1 INTO ls_lfm1", "    WHERE lifnr = gs_eban-flief", "      AND ekorg = c_purch_org.", "  IF sy-subrc <> 0.", "    PERFORM reject USING 'Vendor not created for purchasing org 1000'.", "  ENDIF.", "ENDFORM.", "", "FORM convert_to_eur USING iv_waers TYPE waers", "                 CHANGING cv_amount TYPE bapicurext.", "  DATA lv_local TYPE bapicurext.", "", "  CALL FUNCTION 'CONVERT_TO_LOCAL_CURRENCY'", "    EXPORTING", "      date             = sy-datum", "      foreign_amount   = cv_amount", "      foreign_currency = iv_waers", "      local_currency   = 'EUR'", "    IMPORTING", "      local_amount     = lv_local", "    EXCEPTIONS", "      no_rate_found    = 1", "      OTHERS           = 2.", "  IF sy-subrc = 0.", "    cv_amount = lv_local.", "  ELSE.", "    MESSAGE w004 WITH 'No exchange rate for' iv_waers.", "  ENDIF.", "ENDFORM.", "", "FORM check_cost_center.", "  SELECT SINGLE * FROM csks", "    WHERE kokrs = '1000'", "      AND kostl = gs_eban-kostl", "      AND datbi >= sy-datum.", "  IF sy-subrc <> 0.", "    PERFORM reject USING 'Cost center not valid today'.", "  ENDIF.", "ENDFORM.", "", "FORM check_account_assignment.", "  CASE gs_eban-knttp.", "    WHEN 'K'.", "      PERFORM check_cost_center.", "    WHEN 'F'.", "      IF gs_eban-aufnr IS INITIAL.", "        PERFORM reject USING 'Internal order missing'.", "      ENDIF.", "    WHEN space.", "      \"Stock material - no account assignment needed", "    WHEN OTHERS.", "      PERFORM reject USING 'Account assignment category not allowed'.", "  ENDCASE.", "ENDFORM.", "", "*&---------------------------------------------------------------------*", "*&      Form  CHECK_VENDOR", "*&---------------------------------------------------------------------*", "FORM check_vendor.", "  DATA lv_lifnr TYPE lifnr.", "", "  SELECT SINGLE lifnr FROM zmm_vend_block INTO lv_lifnr", "    WHERE lifnr = gs_eban-flief", "      AND blocked = 'X'.", "  IF sy-subrc = 0.", "    PERFORM reject USING 'Vendor is on the block list'.", "  ENDIF.", "ENDFORM.", "", "FORM reject USING iv_reason TYPE clike.", "  gv_rejected = abap_true.", "  gv_message  = iv_reason.", "  MESSAGE s005 WITH 'Requisition rejected:' iv_reason.", "  PERFORM log_approval.", "ENDFORM.", "", "FORM hold_for_buyer.", "  gv_on_hold = abap_true.", "  gv_message = 'Price deviates from the info record - buyer review'.", "  UPDATE eban SET statu = 'H'", "    WHERE banfn = p_banfn", "      AND bnfpo = p_bnfpo."     ['Complete tables','5','Rules (12), exceptions (18), outputs, data read, integrations — every row.'],
    ['The code’s own wording','24','Every shortened line beside the sentence the code reading wrote.'],
    ['Questions about the requirements','9','With their source ids and why the code cannot answer them.'],
    ['Element table','84','Every element of the process map with its lines.'],
    ['Statements by routine','152','Every statement the engine read, once, grouped by routine.'],
    ['Revisions of this process','1','What was kept, and what changed between two readings.'],
    ['Level D register','2','Modifications and level D enhancements, with the guideline’s three questions.'],
  ];
  return `<section class="card pad" aria-labelledby="ev-h" style="margin-top:12px">
      <h2 class="h2" id="ev-h">Everything the reading found</h2>
      <p class="sm muted" style="margin-top:4px;line-height:1.5">Each sentence once, with its lines. Nothing here is new — the pages above are made from it, and every export prints it as its appendix. ${ILL}</p>
    </section>
    <div class="evlist">${folds.map(([t,c,d],i)=>`<details class="fold" ${i===0&&M.v==='it'?'open':''}><summary>${ic('right','chev')}${t}<span class="r">${c}</span></summary><div class="in sm muted">${d}</div></details>`).join('')}</div>`;
}

/* ---------------- building / empty ---------------- */
function building(){
  return `<div class="status" role="status"><span class="dotx"></span><span>Reading the process from the code</span><span class="bar"><i style="width:55%"></i></span><span class="sub">0:01 · no model, nothing is sent</span>
      <span class="stg"><span class="d">${ic('check','s')}Signed run</span><span class="d">${ic('check','s')}Process</span><span>${ic('circle','s')}Description</span></span></div>
    <section class="card answer"><div><div class="k">Process description · from the code</div><h2 style="margin-top:6px">Emergency purchase approval</h2><p class="prog">Z_MM_PO_APPROVAL · 552 lines</p>
      <div style="margin-top:14px;display:grid;gap:8px;max-width:760px"><span class="wait" style="width:92%"></span><span class="wait" style="width:70%"></span><span class="wait" style="width:48%"></span></div></div>
      <div class="cover"><h3>What this documentation covers</h3><div style="display:grid;gap:8px;margin-top:8px"><span class="wait"></span><span class="wait" style="width:80%"></span><span class="wait" style="width:60%"></span></div></div></section>
    <section class="blk"><div class="blk-h"><h2 class="h2">How it runs</h2><span class="sm muted">the steps appear as they are read</span></div><div class="skt">${'<div></div>'.repeat(11)}</div></section>`;
}
function empty(){
  return `<section class="card empty" aria-labelledby="em-h">
    <h2 id="em-h">Nothing to document yet</h2>
    <p>The description is read from exactly the code an analysis has signed. This project has no such run yet.</p>
    <ul><li>${ic('check')}What the program does, step by step, in plain words</li><li>${ic('check')}Its rules, early ends and the data it changes, each with its lines</li><li>${ic('check')}A file for your own standard: Word, Confluence, Markdown, BPMN</li></ul>
    <div class="acts"><a class="btn primary lg" href="#">Open Analyze${ic('right')}</a><span class="sm muted">No model call. It is written when you open this tool after the analysis.</span></div>
  </section>`;
}

/* ---------------- render ---------------- */
function body(){
  if (M.s==='empty') return empty();
  if (M.s==='building') return building();
  let main='';
  if (M.s==='open' || M.s==='export') main = (M.s==='export'?exportPanel():'') + (M.v==='it'?overviewIT():M.v==='management'?overviewMgmt():overviewBusiness());
  if (M.s==='step') main = stepPage();
  if (M.s==='roles') main = roles();
  if (M.s==='gaps') main = gaps();
  if (M.s==='evidence') main = evidence();
  return nav()+depth()+main;
}
function mockbar(){
  const st = STATES.find(x=>x[0]===M.s) || STATES[0];
  return `<b>Documentation, next · mock-up v1</b>${STATES.map(([k,t])=>`<button class="${M.s===k?'on':''}" data-ms="${k}">${t}</button>`).join('')}<span class="sep"></span>${VIEWS.map(([k,t])=>`<button class="${M.v===k?'on':''}" data-view="${k}">${t}</button>`).join('')}<span class="d">${st[2]} ${M.v!=='business'?`· View: ${M.v==='it'?'IT — denser: technical names, code open, one row of objects.':'Management — shortest: three figures, risks in one line each, the process folded.'}`:''}</span>`;
}
function render(){
  document.body.classList.toggle('v-it', M.v==='it');
  document.getElementById('mock').innerHTML = mockbar();
  document.getElementById('app').innerHTML = shell()+`<main class="frame">${head()}${body()}</main>`;
  const h = `s=${M.s}&v=${M.v}${M.s==='step'?'&step='+M.step:''}${document.body.classList.contains('embed')?'&embed=1':''}`;
  history.replaceState(null,'','#'+h);
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-ms],[data-view],[data-go],[data-step],[data-export],[data-dl]');
  if (!t) return;
  if (t.dataset.ms) return go(t.dataset.ms);
  if (t.dataset.view) { M.v=t.dataset.view; return render(); }
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.step!==undefined) return go('step',{step:+t.dataset.step});
  if (t.hasAttribute('data-export')) return go(M.s==='export'?'open':'export',{xpDone:false});
  if (t.dataset.dl) { M.xpDone=true; return render(); }
});
window.addEventListener('hashchange',()=>{ readHash(); render(); window.scrollTo(0,0); });
readHash(); render();
</script>
</body>
</html>
