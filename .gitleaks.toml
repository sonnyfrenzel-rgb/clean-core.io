# Gitleaks configuration for Clean-Core.io
# Extends the built-in ruleset; adds narrowly-scoped allowlists for values that
# are public by design (not secrets). Keep allowlists path-scoped, never broad
# regexes, so real leaked keys are still caught.

title = "Clean-Core.io gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Public-by-design values (Firebase Web app config apiKey is a public client identifier, not a secret) and deterministic CI test placeholders."
paths = [
  '''firebase-config\.json''',
  # The same file under its first name, kept so the full-history scan still reads old commits correctly.
  '''firebase-applet-config\.json''',
  '''\.env\.example''',
  '''playwright\.config\.ts''',
  # The two sealed registers — security decisions and QA refutations — are ciphertext
  # from one function (`v`, `alg`, `key`, `iv`, `tag`, `data`, nothing else), so there is
  # no plaintext in them to scan. The RSA-OAEP-wrapped AES key crossed the entropy
  # threshold of generic-api-key three times on 18.09.2026 alone; Sonny decided the
  # allowlist over a fingerprint per write. The exact-fingerprint entries in
  # .gitleaksignore stay for the history scan.
  '''docs/security/register\.enc\.json''',
  '''docs/qa/refuted-findings\.enc\.json''',
  # The exception list itself. It holds two kinds of line and no third: an exact
  # fingerprint (`<commit>:<path>:<rule>:<line>`, which carries no value at all)
  # and prose saying why that finding is not a secret. The prose is the problem —
  # an explanation of a false alarm names the thing that raised it, so on
  # 21.09.2026 the comment for CC-056 quoted the ABAP program name it was
  # excusing and `generic-api-key` fired on the excuse (run 35780745211, this
  # file line 25 at 50ac4b64). Rewording that one comment fixed `main` and not
  # the history scan, which keeps reading the old commit, and the next
  # explanation would have done the same thing again. Path-scoped rather than a
  # fingerprint per write, for the same reason as the two registers above.
  '''\.gitleaksignore''',
]
regexes = [
  # Deterministic CI test placeholders — not real credentials.
  '''test-approval-secret-key-\d+''',
  '''test-mfa-pepper-[a-z0-9-]+''',
]
