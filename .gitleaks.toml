# Gitleaks configuration for Clean-Core.io
# Extends the built-in ruleset; adds narrowly-scoped allowlists for values that
# are public by design (not secrets). Keep allowlists path-scoped, never broad
# regexes, so real leaked keys are still caught.

title = "Clean-Core.io gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Public-by-design values (Firebase Web app config apiKey is a public client identifier, not a secret) and deterministic CI test placeholders."
paths = [
  '''firebase-config\.json''',
  # The same file under its first name, kept so the full-history scan still reads old commits correctly.
  '''firebase-applet-config\.json''',
  '''\.env\.example''',
  '''playwright\.config\.ts''',
  # The two sealed registers — security decisions and QA refutations — are ciphertext
  # from one function (`v`, `alg`, `key`, `iv`, `tag`, `data`, nothing else), so there is
  # no plaintext in them to scan. The RSA-OAEP-wrapped AES key crossed the entropy
  # threshold of generic-api-key three times on 18.09.2026 alone; Sonny decided the
  # allowlist over a fingerprint per write. The exact-fingerprint entries in
  # .gitleaksignore stay for the history scan.
  '''docs/security/register\.enc\.json''',
  '''docs/qa/refuted-findings\.enc\.json''',
  # The exception list itself. It holds two kinds of line and no third: an exact
  # fingerprint (`<commit>:<path>:<rule>:<line>`, which carries no value at all)
  # and prose saying why that finding is not a secret. The prose is the problem —
  # an explanation of a false alarm names the thing that raised it, so on
  # 21.09.2026 the comment for CC-056 quoted the ABAP program name it was
  # excusing and `generic-api-key` fired on the excuse (run 35780745211, this
  # file line 25 at 50ac4b64). Rewording that one comment fixed `main` and not
  # the history scan, which keeps reading the old commit, and the next
  # explanation would have done the same thing again. Path-scoped rather than a
  # fingerprint per write, for the same reason as the two registers above.
  '''\.gitleaksignore''',
]
regexes = [
  # Deterministic CI test placeholders — not real credentials.
  '''test-approval-secret-key-\d+''',
  '''test-mfa-pepper-[a-z0-9-]+''',
]

# -- Rule-scoped exceptions for test fixtures ---------------------------------
# Each block names ONE built-in rule, the exact file(s) it may be silenced in,
# and the shape of the fixture line; condition = "AND" means path AND shape must
# both match. A real key pasted anywhere else, or in these files in any other
# shape, is still reported. This replaces per-commit fingerprints, which a
# full-history scan outruns: every rewrite of a fixture is a new commit and a new
# fingerprint. Verified 02.10.2026 with gitleaks 8.24.3 (the version
# gitleaks-action pins); every matched value was checked against the real keys.

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Redaction fixtures: a JS assignment quoted inside a string literal is input text for the QA redactor, not a credential."
condition = "AND"
paths = ['''^tests/qa-review-guard\.spec\.ts$''']
regexTarget = "line"
regexes = ['''^\s*"(const [A-Z_]+|[A-Z_]+) = '[^'\s]+';",?\s*$''']
[[rules.allowlists]]
description = "BYOK fixtures: a fake key literal carrying an obvious placeholder marker (abcd, 1234, gold)."
condition = "AND"
paths = ['''^tests/byok-hardening\.spec\.ts$''']
regexTarget = "line"
regexes = ['''^\s*const (KEY|key) = '[^']*(abcd|1234|gold)[^']*';\s*$''']
[[rules.allowlists]]
description = "Wiring checks that list secret NAMES (upper-case identifiers only, never a value) and assert they reach the workflow."
condition = "AND"
paths = ['''^tests/no-fabricated-figures\.spec\.ts$''']
regexTarget = "line"
regexes = ['''^\s*for \(const name of \[\s*'[A-Z][A-Z0-9_]*'(\s*,\s*'[A-Z][A-Z0-9_]*')*\s*\]\) \{\s*$''']
[[rules.allowlists]]
description = "Reference corpus: a case's objectKey is an ABAP customer-namespace object name (Z, then upper case, digits, underscore)."
condition = "AND"
paths = ['''^tests/korpus/cases/[^/]+/expected\.json$''', '''^docs/korpus/referenzkorpus-v[0-9.]+\.md$''']
regexTarget = "match"
regexes = ['''objectKey["':\s]+Z[A-Z0-9_]+["']?$''']

[[rules]]
id = "jwt"
[[rules.allowlists]]
description = "Redaction fixtures: the jwt.io sample token (payload sub 1234567890) as redactor input."
condition = "AND"
paths = ['''^tests/qa-review-guard\.spec\.ts$''', '''^tests/hardening-v220-cf\.spec\.ts$''']
regexTarget = "line"
regexes = ['''^\s*const jwt = 'eyJ[A-Za-z0-9_.-]+';\s*$''', '''^\s*"const SESSION_TOKEN = 'eyJ[A-Za-z0-9_.-]+';",?\s*$''']

[[rules]]
id = "atlassian-api-token"
[[rules.allowlists]]
description = "Design guard: a list of React component names (FileList, FileUpload, Jira...), not a token."
condition = "AND"
paths = ['''^tests/helpers/design-rules\.ts$''']
regexTarget = "line"
regexes = ['''^\s*\['FileList', 'FileUpload', ('[A-Za-z]+',?\s*)+\]''']
