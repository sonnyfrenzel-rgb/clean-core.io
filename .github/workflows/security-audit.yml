name: Security Audit

# The security agent (docs/SECURITY-AUDIT-AGENT.md): every new release on `main`
# gets a full audit by a CISO and five consultants — Claude Fable 5.1 in Claude
# Code, ultracode, read-only by construction — and the report arrives in the
# owner's inbox, in German. When the agent itself changes on `dev`, the whole
# chain runs once as a self-test with a small model and a $1 cap.
#
# Three jobs, three trust levels:
#   scope    no secrets    decides full audit, self-test or nothing
#   audit    model key     reads the repository, seals the report with the PUBLIC key — cannot open it
#   deliver  private key   opens, renders and mails the report — runs no model
# This repository and its logs are public: nothing the audit finds reaches a log.
#
# Revocation: `gh variable set SECURITY_AUDIT_ENABLED --body false`.
on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  actions: read

# No concurrency group, on purpose. A group holds one running and ONE pending run:
# a third push replaces the pending one, and that release would never get its
# audit (QA review of 52b34aba4cb8, finding 0ea9860d60be). Runs are independent —
# own checkout, own artifact, nothing shared — so every release simply gets its own.

jobs:
  scope:
    name: Scope
    if: vars.SECURITY_AUDIT_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # dev: only when the agent itself changed. An unknown previous tip counts as changed.
          if ! printf '%s' "$BEFORE" | grep -Eq '^[0-9a-f]{40}$' || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "mode=self-test" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$HEAD_SHA" | grep -Eq '^(scripts/security/|docs/security/|\.github/workflows/security-audit\.yml$)'; then
            echo "mode=self-test" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi

  audit:
    name: Audit (sealed)
    needs: scope
    if: needs.scope.outputs.mode == 'full' || needs.scope.outputs.mode == 'self-test'
    runs-on: ubuntu-latest
    # A full ultracode audit takes long; the budget cap ends it before this does.
    timeout-minutes: 180
    # The artifact's name travels as an output: "Re-run failed jobs" on delivery
    # raises run_attempt without re-running this job, so a name rebuilt there would
    # point at an artifact that does not exist (finding 566a50b8581a).
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Name the artifact of this attempt
        id: artifact
        env:
          NAME: security-audit-${{ github.sha }}-${{ github.run_attempt }}
        run: echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Audit the release
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SECURITY_AGENT }}
          SECURITY_AUDIT_MODE: ${{ needs.scope.outputs.mode }}
        run: node scripts/security/audit.mjs

      - name: Upload sealed report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .security-audit/out/security-audit.enc.json
          retention-days: 90
          if-no-files-found: error

  deliver:
    name: Deliver report by mail
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Fetch the sealed report of this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT: ${{ needs.audit.outputs.artifact }}
        run: gh run download "$RUN_ID" --name "$ARTIFACT" -D .security-audit/out

      - name: Mail the report
        env:
          SECURITY_AUDIT_PRIVATE_KEY: ${{ secrets.SECURITY_AUDIT_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/security/deliver.mjs
