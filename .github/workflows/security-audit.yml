name: Security Audit

# The security agent (docs/SECURITY-AUDIT-AGENT.md): every new release on `main`
# gets an audit by a CISO and five consultants — one pinned model on OpenRouter, a
# pipeline of model calls without tools — and the report arrives in the owner's
# inbox, in German. Since 06.10.2026 (owner decision) the consultants read only what
# changed since the last release whose audit succeeded, as the QA agent reviews its
# delta; without such a release they read everything, and with nothing changed no
# model is called at all. Only `main`: the self-test that used to run on
# `dev` whenever the agent changed is gone (Sonny, 16.09.2026) — security is
# tested thoroughly on releases, not sampled on pushes. The self-test mode stays
# available to a person running `SECURITY_AUDIT_MODE=self-test node
# scripts/security/audit.mjs` locally; no workflow triggers it.
#
# Three jobs, three trust levels:
#   scope    no secrets    confirms the release, finds the base, hands mode and base on
#   audit    model key     sends the code to the model, seals the report with the PUBLIC key — cannot open it
#   deliver  private key   opens, renders and mails the report — runs no model
# This repository and its logs are public: nothing the audit finds reaches a log.
#
# Revocation: `gh variable set SECURITY_AUDIT_ENABLED --body false`.
on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

# No concurrency group, on purpose. A group holds one running and ONE pending run:
# a third push replaces the pending one, and that release would never get its
# audit (QA review of 52b34aba4cb8, finding 0ea9860d60be). Runs are independent —
# own checkout, own artifact, nothing shared — so every release simply gets its own.

jobs:
  scope:
    name: Scope
    if: vars.SECURITY_AUDIT_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 40 # up to 30 of them waiting for the QA review of the same release
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      base: ${{ steps.decide.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # One key, one agent at a time (owner decision, 06.10.2026): 16 of the 27 QA runs that failed between
      # 27.09. and 06.10.2026 failed on rate limits, with every agent of a release calling at once. The audit
      # waits for the QA run of the same commit; after 30 minutes it starts anyway, so a stuck review never
      # leaves a release unaudited.
      - name: Wait for the QA review of this release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # Done only once the QA run of this release (main, push — the same commit ran on dev before) has been seen
          # and completed: right after the push GitHub may not list it yet (QA reviews of 6e61722f9e7d and
          # 830bb7eae9e9). None after ten polls, five minutes, means QA is not running for this release, and the
          # audit starts.
          for i in $(seq 1 60); do
            counts=$(gh run list --workflow qa-review.yml --branch main --event push --commit "$SHA" --json status --jq '"\(length) \([.[] | select(.status != "completed")] | length)"')
            total=${counts% *}
            open=${counts#* }
            if [ "$total" -gt 0 ] && [ "$open" = "0" ]; then exit 0; fi
            if [ "$total" = "0" ] && [ "$i" -ge 11 ]; then
              echo "No QA run for this release after five minutes; the audit starts."
              exit 0
            fi
            sleep 30
          done
          echo "The QA review of this release is still running after 30 minutes; the audit starts anyway."

      - name: Decide
        id: decide
        env:
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Only a release on main is audited; any other ref is a misconfiguration, not a sample.
          if [ "$REF_NAME" != "main" ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The base: the release whose audit last succeeded. scope.mjs falls back to a full audit when there is
          # none or when it is not an ancestor of this release (a rewritten history).
          base=$(gh run list --workflow security-audit.yml --branch main --status success --limit 20 --json databaseId,headSha --jq "[.[] | select(.databaseId != $RUN_ID)][0].headSha // \"\"")
          SECURITY_AUDIT_BASE="$base" node scripts/security/scope.mjs | tee -a "$GITHUB_OUTPUT"
          if grep -q '^mode=unchanged$' "$GITHUB_OUTPUT"; then
            echo "### Security audit" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing in the audit scope changed since `${base:0:12}` — no model call, no report." >> "$GITHUB_STEP_SUMMARY"
          fi

  audit:
    name: Audit (sealed)
    needs: scope
    if: needs.scope.outputs.mode == 'full' || needs.scope.outputs.mode == 'delta' || needs.scope.outputs.mode == 'self-test'
    runs-on: ubuntu-latest
    # Up to 128 consultant calls of 50,000 characters, three at a time (lib/team.mjs consultantConcurrency), then the
    # CISO. At the 2.8 minutes per call measured at v3.0.2 that is about two hours of consultants and up to an hour of
    # CISO verification (25 calls, four at a time), with room for rate-limit waits. 120 minutes until
    # 04.10.2026, when the batches were halved and the calls doubled (owner's go). GitHub's limit is 360.
    timeout-minutes: 300
    # The artifact's name travels as an output: "Re-run failed jobs" on delivery
    # raises run_attempt without re-running this job, so a name rebuilt there would
    # point at an artifact that does not exist (finding 566a50b8581a).
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Name the artifact of this attempt
        id: artifact
        env:
          NAME: security-audit-${{ github.sha }}-${{ github.run_attempt }}
        run: echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The whole history: the delta is computed against the base.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Audit the release
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SECURITY_AUDIT_MODE: ${{ needs.scope.outputs.mode }}
          SECURITY_AUDIT_BASE: ${{ needs.scope.outputs.base }}
        run: node scripts/security/audit.mjs

      - name: Upload sealed report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .security-audit/out/security-audit.enc.json
          retention-days: 90
          if-no-files-found: error

  deliver:
    name: Deliver report by mail
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Fetch the sealed report of this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT: ${{ needs.audit.outputs.artifact }}
        run: gh run download "$RUN_ID" --name "$ARTIFACT" -D .security-audit/out

      - name: Mail the report
        env:
          SECURITY_AUDIT_PRIVATE_KEY: ${{ secrets.SECURITY_AUDIT_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # The recipient is a secret, not a literal in a public repository (23.09.2026).
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/security/deliver.mjs
