name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - release
      - main

# Read-only by default, and deliberately WITHOUT `id-token`.
#
# `id-token: write` is not a permission a step asks for when it needs a token —
# it hands every step in the job the two variables (`ACTIONS_ID_TOKEN_REQUEST_URL`
# and `…_TOKEN`) with which anything can mint one. `validate` runs
# `npm ci --foreground-scripts`, which executes the install scripts of every
# transitive dependency. At workflow level, a single malicious package in that
# tree could therefore mint an OIDC token — and the Workload Identity provider
# accepts it on one condition, `attribute.repository`, with no ref and no
# workflow, for a service account holding `roles/editor`, `run.admin` and
# `storage.admin`.
#
# So the permission lives where the token is used and nowhere else: in `deploy`,
# which runs no install scripts. `validate` and `security` keep `contents: read`.
# Narrowing the provider condition itself is the other half and needs gcloud.
permissions:
  contents: read

jobs:
  # Job 1: Build, Lint & Test (Quality Gate)
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Full history, for this job only. tests/terms-version-archive.spec.ts
          # checks the archive's recorded commit and blob against git, and a
          # shallow clone (the default, depth 1) has neither - the test would
          # skip here on every run and verify nothing where it matters most
          # (QA review of 7d9e0a3bdf9f). 906 commits, 36 MB of pack: seconds.
          # The security and deploy jobs stay shallow; they run no tests.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --foreground-scripts

      - name: Run Linting Checks
        run: npm run lint

      # Only Chromium is installed: playwright.config.ts defines a single
      # `chromium` project, so pulling Firefox and WebKit was download time spent
      # on browsers no test ever launches.
      #
      # No `--with-deps`: that runs apt, and on 2026-08-19 the runners' Ubuntu
      # mirror (azure.archive.ubuntu.com) stopped responding, hanging this step
      # for 40+ minutes and blocking every deploy. The ubuntu-latest image already
      # ships Chromium's system libraries, so the browser binary comes straight
      # from the Playwright CDN and apt is out of the picture entirely.
      # The timeout stays as a circuit breaker.
      - name: Install Playwright Browsers
        run: npx playwright install chromium
        timeout-minutes: 10

      - name: Setup Java JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Start Firebase Emulator
        run: |
          npx firebase emulators:start --only auth,firestore --project=cleancore-491216 &
          sleep 10

      # No production secret reaches this job. `MFA_BACKUP_CODE_PEPPER`,
      # `PILOT_APPROVAL_SECRET` and `S4_ENCRYPTION_KEY` used to be handed to the
      # build and to Playwright from the same repository secrets the live
      # service is deployed with — so every test run held the key that every
      # stored S/4 credential is encrypted with, and the secret that signs
      # approval tokens (security audit of v2.11.0, SEC-2026-024). The suite
      # never needed those particular values: it needs *a* pepper, *a* approval
      # secret and *a* 32-byte key, and `playwright.config.ts` sets all three to
      # visibly-test values. The deploy job below keeps the real ones.
      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: 'true'
          FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:9099'
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'

      # E16-F01-US02: the type check is a required gate over everything
      # tsconfig includes — the tests too. `next build` checks application code
      # only, and two type errors in a spec sat unseen for two weeks because
      # nothing else ever ran tsc. After the build, so the route types it
      # generates under .next/types are checked as well.
      - name: Type Check (whole project, tests included)
        run: npm run typecheck

      - name: Run End-to-End Tests
        run: npx playwright test
        env:
          # F-11: server-side test key only — do NOT expose a NEXT_PUBLIC_ (client-bundled) key.
          GEMINI_API_KEY: ${{ secrets.TEST_GEMINI_API_KEY }}
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: 'true'
          FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:9099'
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'

  # Job 1b: Security gate — a failed dependency audit blocks the deploy (F-11)
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'npm'
      # F-11: production dependency audit is a required deploy gate.
      #
      # It blocked on CRITICAL only, with a note to tighten it "once triaged",
      # while Security CI blocked the same tree at HIGH. Two gates with two
      # thresholds means the stricter one is advisory: on 7 September Security CI
      # was red on six High advisories in fast-uri and browserslist, and a deploy
      # of that same commit would have gone through. One threshold now, and it is
      # the stricter one.
      - name: Dependency Audit (production)
        run: npm audit --omit=dev --audit-level=high

  # Job 2a: the isolated test runners (roadmap 8.9, SECURITY.md §7).
  #
  # A job in this pipeline rather than a workflow of its own, for three reasons:
  # the runner image carries the execution core the validate job just tested, so
  # it must pass the same gate (validate + security) before it ships; the app
  # deploy below must not go out ahead of the runner it calls, which only
  # `needs:` can order; and it signs in exactly the way the app deploy does, with
  # the same Workload Identity provider, without a second copy of that setup.
  #
  # Off until the project owner has created the network (runner-net, subnets
  # runner-mock / runner-live, tag-based firewall, private DNS for run.app) and
  # the service account without roles: `vars.RUNNER_DEPLOY_ENABLED == 'true'`.
  # Skipped, the app deploys as before — and without RUNNER_URL a deployed app
  # runs no tests at all ("dort oder gar nicht").
  #
  # No secret of any kind is read in this job. The runners get RUNNER_MODE and,
  # for the live one, the app origin it may relay to — neither is a secret.
  deploy-runner:
    needs: [validate, security]
    if: vars.RUNNER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Security: github.ref_name and the variables are passed via env and
      # checked for shape before they reach an output.
      - name: Set Runner Context
        id: runner-ctx
        env:
          REF_NAME: ${{ github.ref_name }}
          PROXY_ORIGIN_MAIN: ${{ vars.S4_PROXY_BASE_URL_MAIN }}
          PROXY_ORIGIN_DEV: ${{ vars.S4_PROXY_BASE_URL_DEV }}
        run: |
          case "$REF_NAME" in
            main) suffix="";     proxy_origin="$PROXY_ORIGIN_MAIN" ;;
            dev)  suffix="-dev"; proxy_origin="$PROXY_ORIGIN_DEV" ;;
            *)
              echo "::error::The test runners deploy from main and dev only (got $REF_NAME)." >&2
              exit 1
              ;;
          esac
          if [ -n "$proxy_origin" ] && ! printf '%s' "$proxy_origin" | grep -Eq '^https://[a-z0-9.-]+$'; then
            echo "::error::S4_PROXY_BASE_URL_* must be a plain https origin." >&2
            exit 1
          fi
          echo "mock_service=clean-core-runner${suffix}" >> "$GITHUB_OUTPUT"
          echo "live_service=clean-core-runner-live${suffix}" >> "$GITHUB_OUTPUT"
          echo "proxy_origin=${proxy_origin}" >> "$GITHUB_OUTPUT"
          echo "image=europe-west1-docker.pkg.dev/cleancore-491216/cloud-run-source-deploy/clean-core-runner:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Authenticate with Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: 'projects/819734065839/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: '819734065839-compute@developer.gserviceaccount.com'
          project_id: 'cleancore-491216'
          token_format: 'access_token'

      # One image for both services, built from the repository root with the
      # allowlist in runner/Dockerfile.dockerignore: Node, the bundled runner
      # and esbuild. No app code, no .env, no secrets enter the build context.
      - name: Build and Push Runner Image
        id: image
        env:
          IMAGE: ${{ steps.runner-ctx.outputs.image }}
          ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          printf '%s' "$ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin https://europe-west1-docker.pkg.dev
          docker build -f runner/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # The mock runner: its VPC egress reaches nothing.
      - name: Deploy Mock Runner
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: ${{ steps.runner-ctx.outputs.mock_service }}
          region: 'europe-west1'
          image: ${{ steps.image.outputs.digest }}
          project_id: 'cleancore-491216'
          flags: |
            --no-allow-unauthenticated
            --ingress=internal
            --service-account=clean-core-runner@cleancore-491216.iam.gserviceaccount.com
            --network=runner-net
            --subnet=runner-mock
            --vpc-egress=all-traffic
            --network-tags=runner-mock
            --concurrency=1
            --max-instances=3
            --memory=1Gi
            --cpu=1
            --timeout=120
          env_vars_update_strategy: overwrite
          env_vars: |
            RUNNER_MODE=mock

      # The live runner: its VPC egress reaches only the app, through Private
      # Google Access. It relays to that one origin and holds no credential.
      - name: Deploy Live Runner
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: ${{ steps.runner-ctx.outputs.live_service }}
          region: 'europe-west1'
          image: ${{ steps.image.outputs.digest }}
          project_id: 'cleancore-491216'
          flags: |
            --no-allow-unauthenticated
            --ingress=internal
            --service-account=clean-core-runner@cleancore-491216.iam.gserviceaccount.com
            --network=runner-net
            --subnet=runner-live
            --vpc-egress=all-traffic
            --network-tags=runner-live
            --concurrency=1
            --max-instances=2
            --memory=1Gi
            --cpu=1
            --timeout=120
          env_vars_update_strategy: overwrite
          env_vars: |
            RUNNER_MODE=live
            RUNNER_PROXY_ORIGIN=${{ steps.runner-ctx.outputs.proxy_origin }}

  # Job 2: Build & Deploy to Google Cloud Run
  #
  # Waits for the runners when they deploy, and goes ahead when that job is
  # switched off (skipped) — never when it failed.
  deploy:
    needs: [validate, security, deploy-runner]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.security.result == 'success' && (needs.deploy-runner.result == 'success' || needs.deploy-runner.result == 'skipped') }}
    runs-on: ubuntu-latest
    # The one job that authenticates to Google Cloud, and the only one that may
    # mint an OIDC token. It installs nothing, so no dependency's install script
    # runs beside it.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Determine environment specific variables based on push branch
      # Security: github.ref_name is passed via env to prevent shell injection
      - name: Set Environment Context
        id: env-ctx
        env:
          REF_NAME: ${{ github.ref_name }}
          RUNNER_URL_MAIN: ${{ vars.RUNNER_URL_MAIN }}
          RUNNER_URL_DEV: ${{ vars.RUNNER_URL_DEV }}
          RUNNER_LIVE_URL_MAIN: ${{ vars.RUNNER_LIVE_URL_MAIN }}
          RUNNER_LIVE_URL_DEV: ${{ vars.RUNNER_LIVE_URL_DEV }}
          S4_PROXY_BASE_URL_MAIN: ${{ vars.S4_PROXY_BASE_URL_MAIN }}
          S4_PROXY_BASE_URL_DEV: ${{ vars.S4_PROXY_BASE_URL_DEV }}
          APP_VPC_SUBNET: ${{ vars.APP_VPC_SUBNET }}
          RUNNER_SA: ${{ vars.RUNNER_SERVICE_ACCOUNT }}
        run: |
          case "$REF_NAME" in
            main)
              echo "service=clean-core" >> "$GITHUB_OUTPUT"
              echo "db_id=clean-core-eu" >> "$GITHUB_OUTPUT"
              echo "app_url=https://clean-core.io" >> "$GITHUB_OUTPUT"
              ;;
            release)
              # Retired on 2026-08-31. `clean-core-test` was deleted: its serving
              # revision dated from 26 July, `release` itself had not moved since
              # 9 June, and it was a publicly reachable copy of the June
              # application missing six of the seven secrets.
              #
              # This stops loudly instead of rebuilding it. Deploying `release`
              # as it stood would have recreated the service pointing
              # NEXT_PUBLIC_APP_URL at test.clean-core.io — a hostname with no A
              # record — against a Firestore database still in us-west1, carrying
              # the freeTierLimited cap that took the platform down on 19 August.
              # Three known-broken things, restored silently by one push.
              #
              # To bring the lane back: give it a europe-west1 database, restore
              # the domain mapping, and replace this block with the service name.
              echo "::error::The release lane was retired on 2026-08-31 and clean-core-test was deleted." >&2
              echo "::error::Restoring it needs a europe-west1 database and a working test.clean-core.io mapping — see docs/BACKLOG.md." >&2
              exit 1
              ;;
            dev)
              echo "service=clean-core-dev" >> "$GITHUB_OUTPUT"
              echo "db_id=ai-studio-030e1ee1-7e1d-4208-beda-28735bc1a360" >> "$GITHUB_OUTPUT"
              echo "app_url=https://dev.clean-core.io" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: $REF_NAME" >&2
              exit 1
              ;;
          esac

          # Roadmap 8.9: where the app finds the isolated runners and where the
          # live runner finds the app. Empty is allowed and means "not set":
          # without RUNNER_URL a deployed app runs no tests (fail closed), and
          # without the live pair the live path stays refused. Anything that is
          # set has to be a plain https origin.
          case "$REF_NAME" in
            main) runner_url="$RUNNER_URL_MAIN"; runner_live_url="$RUNNER_LIVE_URL_MAIN"; proxy_base="$S4_PROXY_BASE_URL_MAIN" ;;
            *)    runner_url="$RUNNER_URL_DEV";  runner_live_url="$RUNNER_LIVE_URL_DEV";  proxy_base="$S4_PROXY_BASE_URL_DEV" ;;
          esac
          for v in "$runner_url" "$runner_live_url" "$proxy_base"; do
            if [ -n "$v" ] && ! printf '%s' "$v" | grep -Eq '^https://[a-z0-9.-]+$'; then
              echo "::error::RUNNER_URL_*, RUNNER_LIVE_URL_* and S4_PROXY_BASE_URL_* must be plain https origins." >&2
              exit 1
            fi
          done
          echo "runner_url=${runner_url}" >> "$GITHUB_OUTPUT"
          echo "runner_live_url=${runner_live_url}" >> "$GITHUB_OUTPUT"
          echo "proxy_base=${proxy_base}" >> "$GITHUB_OUTPUT"
          if [ -n "$RUNNER_SA" ] && ! printf '%s' "$RUNNER_SA" | grep -Eq '^[a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com$'; then
            echo "::error::RUNNER_SERVICE_ACCOUNT must be a service account e-mail." >&2
            exit 1
          fi
          echo "runner_sa=${RUNNER_SA}" >> "$GITHUB_OUTPUT"

          # An internal-ingress runner answers only requests that come out of
          # the VPC. When the owner has given the app a subnet for that, the
          # app's private-range egress goes there; its public egress (Gemini,
          # mail, tenants) is unchanged. Unset, the app keeps no VPC egress.
          if [ -n "$APP_VPC_SUBNET" ]; then
            if ! printf '%s' "$APP_VPC_SUBNET" | grep -Eq '^[a-z][a-z0-9-]{0,62}$'; then
              echo "::error::APP_VPC_SUBNET must be a subnet name." >&2
              exit 1
            fi
            echo "app_network_flags=--network=runner-net --subnet=${APP_VPC_SUBNET} --vpc-egress=private-ranges-only" >> "$GITHUB_OUTPUT"
          else
            echo "app_network_flags=" >> "$GITHUB_OUTPUT"
          fi

      # F-15: Assert no emulator flag leaks into production deploy
      - name: Assert No Emulator Flag in Deploy
        run: |
          if [ "${NEXT_PUBLIC_USE_FIREBASE_EMULATOR:-}" = "true" ]; then
            echo "::error::FATAL: NEXT_PUBLIC_USE_FIREBASE_EMULATOR must not be 'true' in deploy!"
            exit 1
          fi

      # F-16: Assert production secrets are configured before deploying (Finding F2)
      - name: Assert Production Secrets Configured
        env:
          AUDIT_SIGNING_KEY: ${{ secrets.AUDIT_SIGNING_KEY }}
          S4_HOST_ALLOWLIST: ${{ secrets.S4_HOST_ALLOWLIST }}
        run: |
          if [ -z "$AUDIT_SIGNING_KEY" ]; then
            echo "::error::FATAL: AUDIT_SIGNING_KEY secret is not configured in GitHub Repository secrets!"
            exit 1
          fi
          if [ -z "$S4_HOST_ALLOWLIST" ]; then
            echo "::error::FATAL: S4_HOST_ALLOWLIST secret is not configured in GitHub Repository secrets!"
            exit 1
          fi

      # Authenticate securely with Google Cloud using OIDC Workload Identity Federation
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: 'projects/819734065839/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: '819734065839-compute@developer.gserviceaccount.com'
          project_id: 'cleancore-491216'

      # Deploy source code directly to Cloud Run.
      #
      # AUDIT_SIGNING_PRIVATE_KEY is passed but is NOT asserted above, unlike the
      # other secrets: it is optional by design. Absent, the app signs audit packs
      # with HMAC exactly as it always has and the well-known route answers 503.
      # It is passed anyway so that creating the secret is all it takes to switch
      # Ed25519 on — a feature that needs a workflow edit to activate is not
      # optional, it is unreachable.
      - name: Deploy to Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: ${{ steps.env-ctx.outputs.service }}
          region: 'europe-west1'
          source: '.'
          project_id: 'cleancore-491216'
          flags: |
            --memory=2Gi
            --cpu=2
            --allow-unauthenticated
            --service-account=clean-core-run@cleancore-491216.iam.gserviceaccount.com
            ${{ steps.env-ctx.outputs.app_network_flags }}
            --set-build-env-vars=NEXT_PUBLIC_FIRESTORE_DB_ID=${{ steps.env-ctx.outputs.db_id }},NEXT_PUBLIC_APP_URL=${{ steps.env-ctx.outputs.app_url }},NODE_OPTIONS=--max-old-space-size=4096
          env_vars: |
            NEXT_PUBLIC_FIRESTORE_DB_ID=${{ steps.env-ctx.outputs.db_id }}
            NEXT_PUBLIC_APP_URL=${{ steps.env-ctx.outputs.app_url }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RESEND_WEBHOOK_SECRET=${{ secrets.RESEND_WEBHOOK_SECRET }}
            S4_ENCRYPTION_KEY=${{ secrets.S4_ENCRYPTION_KEY }}
            S4_HOST_ALLOWLIST=${{ secrets.S4_HOST_ALLOWLIST }}
            AUDIT_SIGNING_KEY=${{ secrets.AUDIT_SIGNING_KEY }}
            AUDIT_SIGNING_PRIVATE_KEY=${{ secrets.AUDIT_SIGNING_PRIVATE_KEY }}
            AUDIT_SIGNING_PUBLIC_KEYS_RETIRED=${{ secrets.AUDIT_SIGNING_PUBLIC_KEYS_RETIRED }}
            MFA_BACKUP_CODE_PEPPER=${{ secrets.MFA_BACKUP_CODE_PEPPER }}
            RATE_LIMIT_PEPPER=${{ secrets.RATE_LIMIT_PEPPER }}
            PILOT_APPROVAL_SECRET=${{ secrets.PILOT_APPROVAL_SECRET }}
            NODE_OPTIONS=--max-old-space-size=4096
            COMMIT_SHA=${{ github.sha }}
            RUNNER_URL=${{ steps.env-ctx.outputs.runner_url }}
            RUNNER_LIVE_URL=${{ steps.env-ctx.outputs.runner_live_url }}
            RUNNER_SERVICE_ACCOUNT=${{ steps.env-ctx.outputs.runner_sa }}
            S4_PROXY_BASE_URL=${{ steps.env-ctx.outputs.proxy_base }}
