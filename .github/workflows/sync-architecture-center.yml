name: Sync SAP Architecture Center

# Weekly pull of the reference-architecture metadata of github.com/SAP/architecture-center
# into lib/generated/sap-architecture-center.json (roadmap 3.0.9, owner 11.10.2026).
#
# Only metadata moves: ID, slug, title, last update, archive state. Which reference
# architecture fits which target stays the hand-reviewed mapping in
# lib/sap-reference-architectures.ts; tests/sap-reference-architectures.spec.ts fails on
# the bot branch when an RA the mapping names has gone or changed, and that is the
# signal to review the mapping by hand.
#
# Same shape as sync-catalog.yml, for the same reasons: no pull request (Actions may not
# open one here), the branch is pushed and the QA agent's weekly pipeline check reports
# it while it is ahead of main; the job that installs and syncs holds a read-only token
# and hands over only the data file as an artifact; the push job starts from a fresh
# checkout, runs no npm at all, accepts nothing but the expected path, and runs git with
# hooks and fsmonitor switched off.
on:
  schedule:
    - cron: '30 6 * * 1'   # Mondays 06:30 UTC, after the catalog sync
  workflow_dispatch: {}

permissions:
  contents: read

# One sync at a time, as in sync-sap-references.yml: a manual run started while
# the scheduled one is still going would force-push the same bot branch from
# another state. A later run waits; one still pending when a newer one queues is
# dropped, which loses nothing — the newer one syncs the same upstream.
concurrency:
  group: sync-architecture-center
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Nothing in this job pushes; npm install scripts and tsx run here.
          # persist-credentials: false is what keeps this checkout's token out of
          # .git/config; it is a setting, not a guarantee — recheck it whenever this
          # checkout or any credential handling in this job changes.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --foreground-scripts

      - name: Sync reference architecture metadata
        id: sync
        run: |
          npx tsx scripts/sync-sap-architecture-center.ts
          if [ -n "$(git status --porcelain -- lib/generated/sap-architecture-center.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Only the data file leaves this job.
      - name: Collect the changed data file
        if: steps.sync.outputs.changed == 'true'
        run: |
          out="$RUNNER_TEMP/architecture-sync"
          mkdir -p "$out/lib/generated"
          cp lib/generated/sap-architecture-center.json "$out/lib/generated/sap-architecture-center.json"

      - name: Upload the data file
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: architecture-sync-${{ github.run_id }}
          path: ${{ runner.temp }}/architecture-sync/
          retention-days: 1
          if-no-files-found: error

      - name: No change
        if: steps.sync.outputs.changed == 'false'
        run: echo "### Reference architectures unchanged" >> "$GITHUB_STEP_SUMMARY"

  push:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bot branch; nothing else
    steps:
      # A fresh checkout of the same commit. No package install and no project
      # script runs in this job, so nothing has had a chance to touch .git/.
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the data file
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: architecture-sync-${{ github.run_id }}
          path: ${{ runner.temp }}/architecture-sync

      # The artifact may hold the one data file and nothing else: no other path,
      # no subdirectory, no symlink.
      - name: Accept only the expected path
        run: |
          src="$RUNNER_TEMP/architecture-sync"
          unexpected=$(cd "$src" && find . -mindepth 1 \( -type l -o \( -type d ! -path ./lib ! -path ./lib/generated \) -o \( -type f ! -path ./lib/generated/sap-architecture-center.json \) -o \( ! -type f ! -type d \) \) -print)
          if [ -n "$unexpected" ]; then
            echo "::error::The sync artifact holds unexpected paths:"
            echo "$unexpected"
            exit 1
          fi
          cp "$src/lib/generated/sap-architecture-center.json" lib/generated/sap-architecture-center.json
          changes=$(git status --porcelain --untracked-files=all)
          stray=$(printf '%s\n' "$changes" | grep -vE '^.. lib/generated/sap-architecture-center\.json$' | grep -v '^$' || true)
          if [ -n "$stray" ]; then
            echo "::error::The working tree changed outside the reference architecture data:"
            echo "$stray"
            exit 1
          fi
          if [ -z "$changes" ]; then
            echo "::error::The sync reported a change, but the artifact matches the checkout."
            exit 1
          fi

      - name: Commit the update
        run: |
          git checkout -B chore/sync-sap-architecture-center
          git add lib/generated/sap-architecture-center.json
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(architecture): sync SAP Architecture Center metadata"

      - name: Push the update to its branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c credential.helper= \
            push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:chore/sync-sap-architecture-center
          {
            echo "### Reference architecture update ready"
            echo
            echo "Branch \`chore/sync-sap-architecture-center\` holds this week's sync. It is reviewed — the mapping in"
            echo "\`lib/sap-reference-architectures.ts\` by hand — and brought in through \`dev\`; the weekly QA pipeline"
            echo "check reports it until then."
          } >> "$GITHUB_STEP_SUMMARY"
