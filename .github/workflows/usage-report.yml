name: Weekly Usage Report

# Fridays at 12:00 Europe/Berlin.
#
# GitHub cron only understands UTC, and Berlin is UTC+2 in summer and UTC+1 in
# winter — a single UTC time would drift by an hour twice a year. So the job is
# scheduled at both candidate hours and one of the two is discarded.
#
# WHICH one is discarded is decided by the cron that fired the run, not by the
# clock at the moment it starts. The first version asked "is it 12:00 in Berlin
# right now?", which answers two questions at once: which DST slot am I, and did
# GitHub start me on time. On 2026-08-28 GitHub ran the schedule **four hours
# late** — 14:01 and 14:59 UTC instead of 10:00 and 11:00. Both runs read 16:xx
# Berlin, both concluded they were the wrong slot, both skipped, and both reported
# success. The weekly report simply never went out and nothing said so.
#
# `github.event.schedule` carries the cron expression verbatim and does not move
# when the run is late; the UTC offset tells us the season. Together they pick the
# right slot however far behind GitHub is running, and the report goes out late
# rather than not at all.
on:
  schedule:
    - cron: '0 10 * * 5' # 12:00 Berlin during CEST (summer)
    - cron: '0 11 * * 5' # 12:00 Berlin during CET (winter)
  workflow_dispatch:
    inputs:
      recipient:
        description: 'Send to a different address (optional)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write # OIDC for Google Cloud

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the slot that matches the season
        id: clock
        env:
          # The cron that fired this run, verbatim from the schedule above. Not
          # user input, but passed as an environment variable rather than
          # interpolated into the script, for the same reason as RECIPIENT below.
          FIRED_BY: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "Berlin local time: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual run — proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # +0200 in summer (CEST) → 10:00 UTC is noon; +0100 in winter (CET) →
          # 11:00 UTC is. The offset is a property of the date, so it survives a
          # late start; the wall-clock hour does not.
          OFFSET=$(TZ=Europe/Berlin date +%z)
          if [ "$OFFSET" = "+0200" ]; then WANTED='0 10 * * 5'; else WANTED='0 11 * * 5'; fi
          echo "offset ${OFFSET} → the noon slot today is '${WANTED}'; this run was fired by '${FIRED_BY}'"

          if [ "$FIRED_BY" = "$WANTED" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "this is the other DST slot — skipping, the sibling run sends the report"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Code
        if: steps.clock.outputs.proceed == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        if: steps.clock.outputs.proceed == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        if: steps.clock.outputs.proceed == 'true'
        run: npm ci --foreground-scripts

      - name: Authenticate with Google Cloud
        if: steps.clock.outputs.proceed == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: 'projects/819734065839/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: '819734065839-compute@developer.gserviceaccount.com'
          project_id: 'cleancore-491216'

      - name: Send the report
        if: steps.clock.outputs.proceed == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # The dispatch input reaches the shell as an environment variable,
          # never as interpolated text. Written inline as a ${{ }} expression
          # inside `run:`, a value such as `x@y.com; curl ...` executed as
          # extra commands in a job that holds id-token: write, GCP workload
          # identity federation and the Resend API key.
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          if [ -n "$RECIPIENT" ]; then
            npx tsx scripts/send-usage-report.ts --apply --to "$RECIPIENT"
          else
            npx tsx scripts/send-usage-report.ts --apply
          fi
